            const classFeatures = (char.features || []).filter(f => f.featureType !== 'race' && f.source !== char.race).filter(feat => !feat.level || feat.level <= char.level).sort((a,b) => (a.level||1) - (b.level||1));

            // --- RENDER ---
            if (view === 'list') {
                return (
                    <div className="max-w-2xl mx-auto p-4 animate-fade-in pb-20">
                        <DialogOverlay toast={toast} confirmDialog={confirmDialog} setConfirmDialog={setConfirmDialog} />
                        <header className="flex items-center justify-between mb-8 bg-slate-900/50 p-4 rounded-xl border border-slate-800 backdrop-blur-sm">
                            <h1 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-indigo-400 flex items-center gap-3">
                                <FileText className="text-fuchsia-500" size={28}/> Roster
                            </h1>
                            <a href="./index.html" className="p-2 bg-slate-800 rounded-full text-slate-400 hover:text-white border border-slate-700 transition-colors"><Home size={20}/></a>
                        </header>
                        
                        <div className="grid gap-4 mb-8">
                            {characters.map(c => (
                                <div key={c.id} onClick={() => { setActiveId(c.id); setView('sheet'); }} className="glass-panel p-5 rounded-2xl cursor-pointer hover:border-fuchsia-500/50 transition-all flex justify-between items-center group relative shadow-lg hover:shadow-fuchsia-900/20 transform hover:-translate-y-1">
                                    <div>
                                        <div className="font-black text-white text-xl mb-1">{c.name}</div>
                                        <div className="text-sm text-slate-400 font-medium">Lvl {c.level} {c.race} {c.class}</div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-xs text-fuchsia-300 font-bold bg-fuchsia-900/30 border border-fuchsia-800/50 px-3 py-1 rounded-full shadow-inner">
                                            HP {c.hp?.current}/{c.hp?.max}
                                        </span>
                                        <button onClick={(e) => { e.stopPropagation(); exportData(c); }} className="p-2 bg-slate-800/80 rounded-lg text-slate-400 hover:text-cyan-400 hover:bg-slate-700 transition-colors" title="Export this Character"><Download size={18}/></button>
                                        <button onClick={(e) => { e.stopPropagation(); deleteCharacter(c.id); }} className="p-2 bg-slate-800/80 rounded-lg text-slate-400 hover:text-red-400 hover:bg-slate-700 transition-colors" title="Delete"><Trash2 size={18}/></button>
                                    </div>
                                </div>
                            ))}
                            <button onClick={createNewCharacter} className="p-6 rounded-2xl border-2 border-dashed border-slate-700/50 text-slate-400 hover:border-fuchsia-500 hover:text-fuchsia-400 font-bold flex items-center justify-center gap-2 transition-all bg-slate-900/30 hover:bg-slate-800/50"><Plus size={24}/> Create New Character</button>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl">
                            <h3 className="text-slate-300 text-sm uppercase font-bold mb-4 flex items-center gap-2 tracking-wider"><Scroll size={16} className="text-indigo-400"/> Data Management</h3>
                            <div className="flex gap-3">
                                <button onClick={() => exportData(null)} className="flex-1 btn-secondary"><Download size={18} /> Backup Roster</button>
                                <button onClick={triggerImport} className="flex-1 btn-secondary"><Upload size={18} /> Import Backup</button>
                                <input type="file" ref={fileInputRef} onChange={importData} accept=".json" className="hidden" />
                            </div>
                            <p className="text-[10px] text-slate-500 mt-4 text-center">Data is stored in your browser's local storage. Regularly backup your roster to a file.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24">
                    <DialogOverlay toast={toast} confirmDialog={confirmDialog} setConfirmDialog={setConfirmDialog} />
                    
                    <DiceTray isOpen={trayOpen} onClose={() => setTrayOpen(false)} rollRequest={rollReq} onRollComplete={handleRollComplete} />
                    <DiceBagModal isOpen={diceBagOpen} onClose={() => setDiceBagOpen(false)} onRoll={triggerRoll} />
                    
                    {restModalOpen && <RestModal char={char} onClose={() => setRestModalOpen(false)} onShortRest={handleShortRestRoll} onLongRest={handleLongRest} setDieSize={setHitDieSize} />}
                    {weaponModalOpen && <WeaponPickerModal char={char} onClose={() => setWeaponModalOpen(false)} onAddAttack={handleAddAttackFromModal} />}
                    {armorModalOpen && <ArmorPickerModal char={char} onClose={() => setArmorModalOpen(false)} onEquip={(newAC) => updateChar('ac', newAC)} />}
                    {statModalOpen && <StatAssignerModal char={char} onClose={() => setStatModalOpen(false)} onApply={(newStats) => updateChar('stats', newStats)} />}
                    
                    {viewItem && <ItemDetailModal item={viewItem} onClose={() => setViewItem(null)} />}
                    {viewSpell && <SpellDetailModal spell={viewSpell} onClose={() => setViewSpell(null)} onUpdate={(field, val) => { updateItemInArray('spells', viewSpell.id, field, val); setViewSpell(prev => ({ ...prev, [field]: val })); }} />}
                    {viewFeature && <FeatureDetailModal feature={viewFeature} onClose={() => setViewFeature(null)} onUpdate={(field, val) => { updateItemInArray('features', viewFeature.id, field, val); setViewFeature(prev => ({ ...prev, [field]: val })); }} />}

                    <div className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 shadow-lg">
                        <div className="max-w-4xl mx-auto p-3">
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                                {/* Top Row: Suite & Name */}
                                <div className="flex items-center gap-3 w-full sm:w-auto">
                                    <SuiteDropdown />
                                    <input className="bg-transparent border-none text-xl md:text-2xl font-black text-white focus:ring-0 p-0 w-full truncate border-b border-transparent focus:border-fuchsia-500 transition-colors" value={char.name} onChange={(e) => updateChar('name', e.target.value)} />
                                </div>
                                {/* Bottom Row: Quick Stats */}
                                <div className="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 hide-scrollbar shrink-0">
                                    {isImpaired && <div className="text-red-500 animate-pulse bg-red-900/20 p-1.5 rounded-lg border border-red-800/50" title="Condition Active"><AlertTriangle size={18}/></div>}
                                    <button onClick={() => setRestModalOpen(true)} className="flex items-center gap-1.5 text-xs font-bold text-orange-400 bg-orange-950/40 px-3 py-1.5 rounded-lg border border-orange-900/50 hover:bg-orange-900/60 transition-colors shadow-sm">
                                        <Flame size={14} /> <span>Rest</span>
                                    </button>
                                    <div className="flex items-center gap-1.5 text-xs font-bold text-fuchsia-300 bg-fuchsia-950/40 px-3 py-1.5 rounded-lg border border-fuchsia-900/50 shadow-sm" title="Experience Points">
                                        <span className="opacity-70">XP</span>
                                        <input type="number" className="w-14 bg-transparent border-0 text-center p-0 text-white focus:ring-0" value={char.xp} onChange={(e) => updateChar('xp', parseInt(e.target.value))} />
                                    </div>
                                    <button onClick={() => updateChar('inspiration', !char.inspiration)} className={`flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-lg border transition-all shadow-sm ${char.inspiration ? 'bg-yellow-900/40 text-yellow-300 border-yellow-500/50 shadow-[0_0_10px_rgba(234,179,8,0.2)]' : 'bg-slate-800/50 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>
                                        <span className="opacity-70">Insp</span>
                                        <div className={`w-3 h-3 rounded-full transition-colors ${char.inspiration ? 'bg-yellow-400 shadow-[0_0_8px_rgba(250,204,21,0.8)]' : 'bg-slate-700'}`}></div>
                                    </button>
                                    <div className="flex items-center gap-1.5 text-xs font-black text-indigo-300 bg-indigo-950/40 px-3 py-1.5 rounded-lg border border-indigo-900/50 shadow-sm">
                                        <span className="opacity-70">LVL</span>
                                        <input type="number" className="w-8 bg-transparent border-0 text-center p-0 text-white focus:ring-0" value={char.level} onChange={(e) => updateChar('level', parseInt(e.target.value))} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto p-4 space-y-6 animate-fade-in relative">
                        {/* Details Block */}
                        <div className="glass-panel p-4 rounded-2xl grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div><label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Class</label><input value={char.class} onChange={(e) => updateChar('class', e.target.value)} className="input-base text-sm font-bold" /></div>
                            <div><label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Race</label><input value={char.race} onChange={(e) => updateChar('race', e.target.value)} className="input-base text-sm font-bold" /></div>
                            <div><label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Background</label><input value={char.background} onChange={(e) => updateChar('background', e.target.value)} className="input-base text-sm font-bold" /></div>
                            <div><label className="text-[10px] uppercase font-bold text-slate-500 ml-1">Alignment</label><input value={char.alignment} onChange={(e) => updateChar('alignment', e.target.value)} className="input-base text-sm font-bold" /></div>
                        </div>

                        {/* Top Action Bar */}
                        <div className="flex flex-wrap gap-2 bg-slate-900/50 p-2 rounded-xl border border-slate-800">
                            <button onClick={() => setStatModalOpen(true)} className="flex-1 sm:flex-none btn-secondary text-xs"><Dices size={14}/> Assign Stats</button>
                            <button onClick={() => genesisImportRef.current.click()} className="flex-1 sm:flex-none btn-secondary text-xs text-teal-300 hover:text-teal-200 border-teal-900/50 hover:border-teal-700/50 bg-teal-950/20 hover:bg-teal-900/40"><Dna size={14}/> Import Genesis</button>
                            <input type="file" ref={genesisImportRef} onChange={handleGenesisImport} accept=".json" className="hidden" />
                            <button onClick={copyStatblock} className="flex-1 sm:flex-none btn-secondary text-xs ml-auto"><Copy size={14}/> Statblock</button>
                        </div>

                        {/* Tab Navigation */}
                        <div className="flex gap-2 bg-slate-900/60 p-1.5 rounded-xl border border-slate-800 overflow-x-auto hide-scrollbar">
                            {[ {id:'main', l:'Stats'}, {id:'combat', l:'Combat'}, {id:'magic', l:'Magic & Feats'}, {id:'bio', l:'Inventory & Notes'} ].map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex-1 whitespace-nowrap px-4 py-2.5 text-sm font-bold rounded-lg transition-all ${activeTab === t.id ? 'bg-fuchsia-600 text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>{t.l}</button>
                            ))}
                        </div>

                        {activeTab === 'main' && (
                            <div className="animate-slide-up space-y-4">
                                <div className="glass-panel p-6 rounded-2xl flex flex-wrap justify-center gap-4 sm:gap-6">
                                    {Object.keys(char.stats).map(stat => ( <StatBox key={stat} label={stat} value={char.stats[stat]} onChange={(v) => updateStat(stat, v)} /> ))}
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="glass-panel p-5 rounded-2xl">
                                        <h3 className="font-bold text-slate-300 border-b border-slate-700/50 pb-3 mb-3 flex items-center gap-2">Skills <span className="text-[10px] font-normal text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">Click to cycle proficiency</span></h3>
                                        <div className="space-y-0.5 pr-1">{SKILLS.map(skill => <SkillRow key={skill.name} skill={skill} char={char} onCycle={cycleSkillProficiency} />)}</div>
                                    </div>
                                    <div className="glass-panel p-5 rounded-2xl flex flex-col">
                                        <h3 className="font-bold text-slate-300 border-b border-slate-700/50 pb-3 mb-3">Proficiencies & Languages</h3>
                                        <textarea className="flex-1 input-base resize-none h-full min-h-[200px]" placeholder="Armor, Weapons, Tools, Languages..." value={char.otherProficiencies || ""} onChange={(e) => updateChar('otherProficiencies', e.target.value)}></textarea>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'combat' && (
                            <div className="animate-slide-up space-y-4">
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="glass-panel rounded-2xl text-center relative group bg-gradient-to-b from-cyan-900/10 to-transparent border-cyan-800/30 hover:border-cyan-500/50 transition-colors p-4 flex flex-col justify-center shadow-lg">
                                        <button onClick={() => setArmorModalOpen(true)} className="absolute top-3 right-3 p-1.5 bg-slate-900/80 rounded-lg border border-slate-600 text-slate-400 hover:text-cyan-400 hover:bg-slate-800 transition-all z-10 hover:scale-110 shadow-sm" title="Armor Config"><Settings size={14}/></button>
                                        <Shield className="mx-auto mb-2 text-cyan-400 opacity-80" size={28}/>
                                        <div className="text-xs uppercase text-slate-400 font-bold tracking-wider mb-1">Armor Class</div>
                                        <input type="number" className="w-full text-center text-3xl font-black bg-transparent border-none focus:ring-0 text-white p-0" value={char.ac} onChange={e=>updateChar('ac', parseInt(e.target.value))}/>
                                    </div>
                                    <div className="glass-panel rounded-2xl text-center cursor-pointer bg-gradient-to-b from-yellow-900/10 to-transparent border-yellow-800/30 hover:border-yellow-500/50 transition-colors p-4 flex flex-col justify-center shadow-lg group" onClick={() => triggerRoll('Initiative', '1d20', char.initiative)}>
                                        <D20 className="mx-auto mb-2 text-yellow-400 opacity-80 group-hover:scale-110 transition-transform" size={28}/>
                                        <div className="text-xs uppercase text-slate-400 font-bold tracking-wider mb-1">Initiative</div>
                                        <input type="number" className="w-full text-center text-3xl font-black bg-transparent border-none focus:ring-0 text-white p-0" value={char.initiative} onChange={e=>updateChar('initiative', parseInt(e.target.value))} onClick={e=>e.stopPropagation()}/>
                                    </div>
                                    <div className="glass-panel rounded-2xl text-center bg-gradient-to-b from-fuchsia-900/10 to-transparent border-fuchsia-800/30 hover:border-fuchsia-500/50 transition-colors p-4 flex flex-col justify-center shadow-lg">
                                        <Zap className="mx-auto mb-2 text-fuchsia-400 opacity-80" size={28}/>
                                        <div className="text-xs uppercase text-slate-400 font-bold tracking-wider mb-1">Speed</div>
                                        <div className="flex items-center justify-center">
                                            <input type="number" className="w-16 text-center text-3xl font-black bg-transparent border-none focus:ring-0 text-white p-0" value={char.speed} onChange={e=>updateChar('speed', parseInt(e.target.value))}/>
                                            <span className="text-slate-500 text-sm font-bold -ml-2">ft</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl">
                                    <div className="flex justify-between border-b border-slate-700/50 pb-3 mb-4"><h3 className="font-bold text-slate-200 flex items-center gap-2"><Heart className="text-green-500" size={18}/> Hit Points</h3></div>
                                    <div className="flex gap-3 items-center mb-5">
                                        <div className="flex-1 bg-slate-900/50 p-3 rounded-xl border border-slate-800"><label className="text-[10px] text-slate-500 uppercase font-bold block text-center mb-1">Current</label><input type="number" className="w-full text-3xl font-black text-center bg-transparent border-0 focus:ring-0 text-white p-0" value={char.hp.current} onChange={(e) => updateHP('current', parseInt(e.target.value))} /></div>
                                        <div className="flex-1 bg-slate-900/30 p-3 rounded-xl border border-slate-800"><label className="text-[10px] text-slate-500 uppercase font-bold block text-center mb-1">Max</label><input type="number" className="w-full text-3xl font-black text-center bg-transparent border-0 focus:ring-0 text-slate-400 p-0" value={char.hp.max} onChange={(e) => updateHP('max', parseInt(e.target.value))} /></div>
                                        <div className="flex-1 bg-purple-900/10 p-3 rounded-xl border border-purple-900/30"><label className="text-[10px] text-purple-400 uppercase font-bold block text-center mb-1">Temp</label><input type="number" className="w-full text-3xl font-black text-center bg-transparent border-0 focus:ring-0 text-purple-300 p-0" value={char.hp.temp} onChange={(e) => updateHP('temp', parseInt(e.target.value))} /></div>
                                    </div>
                                    
                                    <div className="flex gap-4">
                                        <div className="flex-1 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex flex-col items-center">
                                            <span className="text-[10px] uppercase text-slate-400 font-bold mb-2">Hit Dice (d{char.hp.hitDieSize||8})</span>
                                            <div className="flex items-center gap-2">
                                                <input type="number" className="w-10 text-center bg-slate-800 rounded border border-slate-600 text-lg font-bold text-white py-1" value={char.hp.hitDiceCurrent || 0} onChange={e=>updateHP('hitDiceCurrent', parseInt(e.target.value))} />
                                                <span className="text-slate-500 font-black">/</span>
                                                <span className="w-10 text-center text-lg font-bold text-slate-400 bg-slate-900 py-1 rounded border border-slate-800">{char.level}</span>
                                            </div>
                                        </div>
                                        <div className="flex-1 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center">
                                            <span className="text-[10px] uppercase text-slate-400 font-bold mb-2">Death Saves</span>
                                            <div className="flex gap-5 text-sm">
                                                <div className="flex gap-1.5 items-center"><span className="text-green-500 font-black mr-1">S</span>{[1,2,3].map(i=><div key={i} onClick={()=>updateDeathSave('successes', (char.deathSaves?.successes===i?i-1:i))} className={`w-4 h-4 rounded-full border-2 border-green-600/50 cursor-pointer transition-colors ${char.deathSaves?.successes>=i?'bg-green-500 border-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]':'bg-slate-800 hover:bg-green-900/50'}`}></div>)}</div>
                                                <div className="flex gap-1.5 items-center"><span className="text-red-500 font-black mr-1">F</span>{[1,2,3].map(i=><div key={i} onClick={()=>updateDeathSave('failures', (char.deathSaves?.failures===i?i-1:i))} className={`w-4 h-4 rounded-full border-2 border-red-600/50 cursor-pointer transition-colors ${char.deathSaves?.failures>=i?'bg-red-500 border-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]':'bg-slate-800 hover:bg-red-900/50'}`}></div>)}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl">
                                    <h3 className="font-bold text-slate-200 border-b border-slate-700/50 pb-3 mb-4">Saving Throws</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                        {['str','dex','con','int','wis','cha'].map(stat => {
                                            const mod = getMod(char.stats[stat]);
                                            const isProf = (char.savingThrows||[]).includes(stat);
                                            const calcTotal = mod + (isProf ? pb : 0);
                                            const overrideVal = char.saveOverrides ? char.saveOverrides[stat] : undefined;
                                            let displayVal = overrideVal !== undefined ? overrideVal : (calcTotal >= 0 ? `+${calcTotal}` : `${calcTotal}`);
                                            const isPositive = displayVal.toString().includes('+') || (!displayVal.toString().includes('-') && parseInt(displayVal) >= 0);

                                            return (
                                                <div key={stat} className={`flex justify-between items-center p-3 rounded-xl border transition-colors ${isProf ? 'bg-fuchsia-900/20 border-fuchsia-500/50 shadow-inner' : 'bg-slate-900/50 border-slate-700 hover:border-slate-500'}`}>
                                                    <span className="uppercase text-xs font-bold text-slate-400">{stat}</span>
                                                    <input type="text" className={`w-14 text-right bg-transparent border-b-2 border-transparent hover:border-slate-600 focus:border-fuchsia-500 p-0 focus:ring-0 font-mono font-bold text-lg outline-none transition-colors ${isPositive ? 'text-green-400' : 'text-red-400'}`} value={displayVal} onChange={(e) => { const val = e.target.value; const overrides = char.saveOverrides || {}; if (val === '') { const newOverrides = { ...overrides }; delete newOverrides[stat]; updateChar('saveOverrides', newOverrides); } else updateChar('saveOverrides', { ...overrides, [stat]: val }); }} />
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl">
                                    <div className="flex justify-between items-center border-b border-slate-700/50 pb-3 mb-4"><h3 className="font-bold text-slate-200 flex items-center gap-2"><Sword size={18}/> Attacks</h3><button onClick={() => setWeaponModalOpen(true)} className="btn-secondary py-1 px-3 text-xs"><Plus size={14}/> Add Weapon</button></div>
                                    <div className="space-y-3">
                                        {(char.attacks||[]).filter(att => !att.level || att.level <= char.level).map(att => (
                                            <div key={att.id} className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 grid grid-cols-12 gap-3 items-center group relative hover:border-slate-500 transition-colors">
                                                <input className="col-span-12 md:col-span-5 bg-transparent border-b border-slate-700 hover:border-slate-500 focus:border-fuchsia-500 text-sm font-bold text-white placeholder-slate-600 p-1 focus:ring-0 transition-colors" value={att.name} onChange={e=>updateItemInArray('attacks', att.id, 'name', e.target.value)} placeholder="Weapon Name" />
                                                <div className="col-span-4 md:col-span-2 flex flex-col">
                                                    <span className="text-[8px] text-slate-500 uppercase font-bold text-center">Bonus</span>
                                                    <input className="bg-transparent border-none text-base font-black text-center text-green-400 p-0 focus:ring-0" value={att.bonus} onChange={e=>updateItemInArray('attacks', att.id, 'bonus', e.target.value)} placeholder="+0" />
                                                </div>
                                                <div className="col-span-4 md:col-span-2 flex flex-col">
                                                    <span className="text-[8px] text-slate-500 uppercase font-bold text-center">Damage</span>
                                                    <input className="bg-transparent border-none text-base font-mono font-bold text-center text-yellow-400 p-0 focus:ring-0" value={att.damage} onChange={e=>updateItemInArray('attacks', att.id, 'damage', e.target.value)} placeholder="1d8" />
                                                </div>
                                                <div className="col-span-3 md:col-span-2 flex flex-col">
                                                    <span className="text-[8px] text-slate-500 uppercase font-bold text-center">Type</span>
                                                    <input className="bg-transparent border-none text-xs text-center text-slate-400 p-0 focus:ring-0" value={att.type} onChange={e=>updateItemInArray('attacks', att.id, 'type', e.target.value)} placeholder="Slash" />
                                                </div>
                                                <button onClick={() => deleteItemFromArray('attacks', att.id)} className="col-span-1 md:col-span-1 text-slate-600 hover:text-red-500 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={16}/></button>
                                            </div>
                                        ))}
                                        {char.attacks.length === 0 && <p className="text-center text-sm text-slate-500 italic py-4">No weapons equipped.</p>}
                                    </div>
                                </div>

                                {/* Combat Spells Integration */}
                                <div className="glass-panel p-5 rounded-2xl">
                                    <h3 className="font-bold text-slate-200 border-b border-slate-700/50 pb-3 mb-4 flex items-center gap-2"><Wand size={18} className="text-purple-400"/> Prepared Combat Spells</h3>
                                    <div className="space-y-3">
                                        {char.spells.filter(s => s.prepared).map(spell => {
                                            const baseLvl = spell.level || 0;
                                            const castLvl = castLevels[spell.id] !== undefined ? castLevels[spell.id] : baseLvl;
                                            let finalDamage = spell.damage || "";
                                            if (spell.upcast && castLvl > baseLvl) {
                                                const diff = castLvl - baseLvl;
                                                const match = spell.upcast.match(/^(\d+)d(\d+)$/i);
                                                let upcastStr = match ? `${parseInt(match[1]) * diff}d${match[2]}` : `${diff}x ${spell.upcast}`;
                                                finalDamage += ` + ${upcastStr}`;
                                            }

                                            return (
                                                <div key={spell.id} className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex flex-col gap-2 relative overflow-hidden">
                                                    <div className="absolute left-0 top-0 bottom-0 w-1 bg-purple-500"></div>
                                                    <div className="flex justify-between items-center pl-2">
                                                        <span className="font-bold text-white text-sm">{spell.name}</span>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-[10px] text-slate-500 font-bold uppercase">Cast At:</span>
                                                            <select className="input-base w-auto text-xs py-1" value={castLvl} onChange={e => setCastLevels(prev => ({...prev, [spell.id]: parseInt(e.target.value)}))}>
                                                                {baseLvl === 0 ? <option value={0}>Cantrip</option> : Array.from({length: 10 - baseLvl}, (_, i) => baseLvl + i).map(l => <option key={l} value={l}>Lvl {l}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div className="flex flex-wrap gap-2 text-xs pl-2">
                                                        {spell.isAttack && <span className="bg-purple-900/30 text-purple-300 border border-purple-800/50 px-2 py-0.5 rounded font-bold">Attack: +{spellAttack}</span>}
                                                        {spell.saveStat && <span className="bg-orange-900/30 text-orange-300 border border-orange-800/50 px-2 py-0.5 rounded font-bold">Save: DC {spellDC} {spell.saveStat.toUpperCase()}</span>}
                                                        {finalDamage && <span className="bg-red-900/30 text-red-300 border border-red-800/50 px-2 py-0.5 rounded font-mono font-bold">Dmg: {finalDamage}</span>}
                                                        {(!spell.isAttack && !spell.saveStat && !finalDamage) && <span className="text-[10px] text-slate-500 italic">Utility / Buff</span>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {char.spells.filter(s => s.prepared).length === 0 && <div className="text-sm text-slate-500 italic py-4 text-center">No spells prepared. Go to the Magic tab to prepare spells.</div>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'magic' && (
                            <div className="animate-slide-up space-y-4">
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="glass-panel p-4 rounded-2xl text-center bg-slate-900/40">
                                        <div className="text-xs uppercase text-slate-400 font-bold tracking-wider mb-2">Casting Stat</div>
                                        <select className="w-full bg-slate-800 border border-slate-600 rounded-lg text-sm text-white font-bold p-1 text-center focus:border-fuchsia-500 focus:ring-0" value={char.spellAbility} onChange={e=>updateChar('spellAbility', e.target.value)}>{['int','wis','cha'].map(s=><option key={s} value={s}>{s.toUpperCase()}</option>)}</select>
                                    </div>
                                    <div className="glass-panel p-4 rounded-2xl text-center bg-gradient-to-b from-orange-900/10 to-transparent border-orange-800/30 shadow-sm">
                                        <div className="text-xs uppercase text-slate-400 font-bold tracking-wider mb-1">Save DC</div>
                                        <div className="text-3xl font-black text-orange-400">{spellDC}</div>
                                    </div>
                                    <div className="glass-panel p-4 rounded-2xl text-center bg-gradient-to-b from-purple-900/10 to-transparent border-purple-800/30 shadow-sm">
                                        <div className="text-xs uppercase text-slate-400 font-bold tracking-wider mb-1">Attack Mod</div>
                                        <div className="text-3xl font-black text-purple-400">+{spellAttack}</div>
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl">
                                    <div className="flex justify-between items-center border-b border-slate-700/50 pb-3 mb-4"><h3 className="font-bold text-slate-200 flex items-center gap-2"><Battery size={18} className="text-cyan-400"/> Resources</h3><button onClick={addResource} className="btn-secondary py-1 px-3 text-xs"><Plus size={14}/> Add</button></div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {(char.resources||[]).map(res => (
                                            <div key={res.id} className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex items-center justify-between gap-3 group hover:border-cyan-500/50 transition-colors">
                                                <input className="bg-transparent border-b border-slate-700 text-sm font-bold text-white w-full focus:border-cyan-500 p-0 focus:ring-0 transition-colors" value={res.name} onChange={e=>updateItemInArray('resources', res.id, 'name', e.target.value)} placeholder="Rage / Ki / Sorcery Points" />
                                                <div className="flex items-center gap-2 bg-slate-800 px-2 py-1 rounded-lg border border-slate-600">
                                                    <input type="number" className="w-8 text-center bg-transparent border-none text-base font-bold text-white p-0 focus:ring-0" value={res.current} onChange={e=>updateItemInArray('resources', res.id, 'current', parseInt(e.target.value))} />
                                                    <span className="text-slate-500 font-black">/</span>
                                                    <input type="number" className="w-8 text-center bg-transparent border-none text-base font-bold text-slate-400 p-0 focus:ring-0" value={res.max} onChange={e=>updateItemInArray('resources', res.id, 'max', parseInt(e.target.value))} />
                                                </div>
                                                <button onClick={() => deleteItemFromArray('resources', res.id)} className="text-slate-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl">
                                    <h3 className="font-bold text-slate-200 border-b border-slate-700/50 pb-3 mb-4">Spell Slots</h3>
                                    <div className="flex flex-wrap justify-center gap-3">
                                        {[1,2,3,4,5,6,7,8,9].map(lvl => {
                                            const slot = (char.spellSlots && char.spellSlots[lvl]) || {total:0, used:0};
                                            return (
                                                <div key={lvl} className="bg-slate-900/50 p-2 rounded-xl border border-slate-700/50 text-center min-w-[70px]">
                                                    <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 border-b border-slate-800 pb-1">Lvl {lvl}</div>
                                                    <div className="flex items-center justify-center gap-1 mt-1">
                                                        <input type="number" className="w-6 text-center bg-slate-800 rounded text-sm font-bold text-white p-0 border border-slate-600 focus:ring-0" value={slot.used} onChange={e => { const newSlots = {...char.spellSlots}; if(!newSlots[lvl]) newSlots[lvl] = {total:0, used:0}; newSlots[lvl].used = parseInt(e.target.value)||0; updateChar('spellSlots', newSlots); }} />
                                                        <span className="text-slate-600 text-xs font-black">/</span>
                                                        <input type="number" className="w-6 text-center bg-transparent text-sm font-bold text-slate-400 p-0 border-none focus:ring-0" value={slot.total} onChange={e => { const newSlots = {...char.spellSlots}; if(!newSlots[lvl]) newSlots[lvl] = {total:0, used:0}; newSlots[lvl].total = parseInt(e.target.value)||0; updateChar('spellSlots', newSlots); }} />
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl">
                                    <div className="flex justify-between items-center border-b border-slate-700/50 pb-3 mb-4"><h3 className="font-bold text-slate-200 flex items-center gap-2"><Wand size={18} className="text-purple-400"/> Grimoire</h3><button onClick={addSpell} className="btn-secondary py-1 px-3 text-xs"><Plus size={14}/> Add Spell</button></div>
                                    <div className="space-y-2">
                                        {(char.spells||[]).sort((a,b)=>a.level-b.level).map(spell => (
                                            <div key={spell.id} className="flex gap-3 items-center bg-slate-900/50 p-2 rounded-xl border border-slate-700/50 group hover:border-purple-500/50 transition-colors">
                                                <div className="flex flex-col items-center bg-slate-800 rounded px-1 py-0.5 border border-slate-700 shrink-0">
                                                    <span className="text-[8px] uppercase font-bold text-slate-500">Lvl</span>
                                                    <input type="number" className="w-6 bg-transparent text-center text-xs font-bold text-white border-none p-0 focus:ring-0" value={spell.level} onChange={e=>updateItemInArray('spells', spell.id, 'level', parseInt(e.target.value))} />
                                                </div>
                                                <div className="flex-1 flex items-center justify-between gap-3 min-w-0">
                                                    <input className="w-full bg-transparent border-b border-transparent hover:border-slate-600 focus:border-purple-500 text-sm font-bold text-white placeholder-slate-600 focus:ring-0 p-1 transition-colors truncate" value={spell.name} onChange={e=>updateItemInArray('spells', spell.id, 'name', e.target.value)} placeholder="Spell Name" />
                                                    <button onClick={() => setViewSpell(spell)} className="text-slate-500 hover:text-purple-400 p-1 bg-slate-800 rounded transition-colors shrink-0" title="Edit Spell Data"><Settings size={14}/></button>
                                                </div>
                                                <button onClick={()=>updateItemInArray('spells', spell.id, 'prepared', !spell.prepared)} className={`text-[10px] px-3 py-1.5 rounded-lg border font-bold transition-all shrink-0 ${spell.prepared ? 'bg-purple-600 text-white border-purple-500 shadow-md' : 'bg-slate-800 text-slate-400 border-slate-600 hover:bg-slate-700'}`}>PREP</button>
                                                <button onClick={() => deleteItemFromArray('spells', spell.id)} className="text-slate-600 hover:text-red-500 p-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={16}/></button>
                                            </div>
                                        ))}
                                        {char.spells.length === 0 && <p className="text-center text-sm text-slate-500 italic py-4">Your grimoire is empty.</p>}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {/* RACE FEATURES ACCORDION */}
                                    <details className="glass-panel p-5 rounded-2xl group" open>
                                        <summary className="font-bold text-slate-200 flex justify-between items-center cursor-pointer list-none outline-none border-b border-slate-700/50 pb-3">
                                            <div className="flex items-center gap-2"><Sparkles size={18} className="text-amber-400"/> Racial Traits</div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={(e) => { e.preventDefault(); addFeature('race'); }} className="btn-secondary py-1 px-2 text-[10px]"><Plus size={12}/> ADD</button>
                                                <ChevronDown size={18} className="text-slate-500 group-open:rotate-180 transition-transform" />
                                            </div>
                                        </summary>
                                        <div className="mt-4 space-y-2">
                                            {raceFeatures.map(feat => (
                                                <div key={feat.id} className="flex items-center justify-between bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 group/item hover:border-amber-500/50 cursor-pointer transition-colors" onClick={() => setViewFeature(feat)}>
                                                    <div className="flex items-center gap-3 min-w-0 pr-2">
                                                        <span className="text-[10px] bg-slate-800 text-amber-400 px-2 py-1 rounded font-bold uppercase border border-slate-700 shrink-0">Lvl {feat.level || 1}</span>
                                                        <span className="text-sm font-bold text-white truncate">{feat.name}</span>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); deleteItemFromArray('features', feat.id); }} className="text-slate-600 hover:text-red-500 opacity-0 group-hover/item:opacity-100 transition-opacity p-1 shrink-0"><Trash2 size={16}/></button>
                                                </div>
                                            ))}
                                            {raceFeatures.length === 0 && <div className="text-sm text-slate-500 italic py-4 text-center">No racial traits added yet.</div>}
                                            {char.features && char.features.some(f => (f.featureType === 'race' || f.source === char.race) && f.level > char.level) && (
                                                <div className="text-center text-xs text-slate-500 italic mt-3 bg-slate-800/30 p-3 rounded-lg border border-dashed border-slate-700">Higher level traits are hidden until you level up.</div>
                                            )}
                                        </div>
                                    </details>

                                    {/* CLASS FEATURES ACCORDION */}
                                    <details className="glass-panel p-5 rounded-2xl group" open>
                                        <summary className="font-bold text-slate-200 flex justify-between items-center cursor-pointer list-none outline-none border-b border-slate-700/50 pb-3">
                                            <div className="flex items-center gap-2"><BookOpen size={18} className="text-fuchsia-400"/> Class Features</div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={(e) => { e.preventDefault(); addFeature('class'); }} className="btn-secondary py-1 px-2 text-[10px]"><Plus size={12}/> ADD</button>
                                                <ChevronDown size={18} className="text-slate-500 group-open:rotate-180 transition-transform" />
                                            </div>
                                        </summary>
                                        <div className="mt-4 space-y-2">
                                            {classFeatures.map(feat => (
                                                <div key={feat.id} className="flex items-center justify-between bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 group/item hover:border-fuchsia-500/50 cursor-pointer transition-colors" onClick={() => setViewFeature(feat)}>
                                                    <div className="flex items-center gap-3 min-w-0 pr-2">
                                                        <span className="text-[10px] bg-slate-800 text-fuchsia-300 px-2 py-1 rounded font-bold uppercase border border-slate-700 shrink-0">Lvl {feat.level || 1}</span>
                                                        <span className="text-sm font-bold text-white truncate">{feat.name}</span>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); deleteItemFromArray('features', feat.id); }} className="text-slate-600 hover:text-red-500 opacity-0 group-hover/item:opacity-100 transition-opacity p-1 shrink-0"><Trash2 size={16}/></button>
                                                </div>
                                            ))}
                                            {classFeatures.length === 0 && <div className="text-sm text-slate-500 italic py-4 text-center">No class features added yet.</div>}
                                            {char.features && char.features.some(f => (f.featureType !== 'race' && f.source !== char.race) && f.level > char.level) && (
                                                <div className="text-center text-xs text-slate-500 italic mt-3 bg-slate-800/30 p-3 rounded-lg border border-dashed border-slate-700">Higher level features are hidden until you level up.</div>
                                            )}
                                        </div>
                                    </details>
                                </div>
                            </div>
                        )}

                        {activeTab === 'bio' && (
                            <div className="animate-slide-up grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="glass-panel p-5 rounded-2xl min-h-[400px] flex flex-col">
                                    <div className="flex justify-between items-center border-b border-slate-700/50 pb-3 mb-4">
                                        <h3 className="font-bold text-slate-200 flex items-center gap-2"><Backpack size={18} className="text-amber-500"/> Inventory</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => lootImportRef.current.click()} className="btn-secondary py-1 px-2 text-[10px]" title="Import Loot JSON"><Upload size={14}/> Import</button>
                                            <input type="file" ref={lootImportRef} onChange={handleLootImport} accept=".json" className="hidden" />
                                            <button onClick={addItem} className="btn-secondary py-1 px-2 text-[10px]"><Plus size={14}/> Add Item</button>
                                        </div>
                                    </div>
                                    
                                    <div className="mb-5 bg-slate-900/60 p-4 rounded-xl border border-indigo-500/30 relative overflow-hidden shadow-inner">
                                        <div className="absolute top-0 left-0 w-1.5 h-full bg-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.8)]"></div>
                                        <h4 className="text-xs font-bold text-indigo-300 uppercase mb-3 flex justify-between items-center pl-2">
                                            <span className="flex items-center gap-1.5"><LinkIcon size={14}/> Attunement Slots</span>
                                            <span className="bg-indigo-900/50 px-2 py-0.5 rounded border border-indigo-700/50">{char.attunedItems.filter(i=>i).length} / 3</span>
                                        </h4>
                                        <div className="space-y-3 pl-2">
                                            {[0,1,2].map(idx => (
                                                <div key={idx} className="flex items-center gap-3">
                                                    <div className={`w-2.5 h-2.5 rounded-full transition-all duration-500 ${char.attunedItems[idx] ? 'bg-indigo-400 shadow-[0_0_10px_rgba(129,140,248,0.8)]' : 'bg-slate-700 border border-slate-600'}`}></div>
                                                    <input 
                                                        className="flex-1 bg-transparent border-b border-slate-700 text-sm py-1.5 focus:border-indigo-500 placeholder-slate-600 transition-colors text-slate-200 focus:outline-none focus:ring-0"
                                                        placeholder="Unattuned slot..."
                                                        value={char.attunedItems[idx]}
                                                        onChange={(e) => { const newAttuned = [...char.attunedItems]; newAttuned[idx] = e.target.value; updateChar('attunedItems', newAttuned); }}
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex-1 space-y-2 overflow-y-auto max-h-96 pr-2 hide-scrollbar">
                                        {char.inventory.map(item => (
                                            <div key={item.id} className="flex gap-3 items-start bg-slate-900/40 p-3 rounded-xl border border-slate-700/50 group hover:border-slate-500 transition-colors">
                                                <div className="flex flex-col items-center shrink-0">
                                                    <span className="text-[8px] uppercase font-bold text-slate-500">Qty</span>
                                                    <input className="w-10 text-center bg-slate-800 rounded text-xs font-bold text-white border border-slate-600 p-1 focus:ring-0" value={item.qty} onChange={(e) => updateInventory(item.id, 'qty', e.target.value)} />
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <input className="w-full bg-transparent border-b border-transparent hover:border-slate-600 focus:border-amber-500 p-0 text-sm font-bold text-white focus:ring-0 placeholder-slate-600 transition-colors truncate" value={item.name} onChange={(e) => updateInventory(item.id, 'name', e.target.value)} placeholder="Item Name" />
                                                        <button onClick={() => setViewItem(item)} className="text-slate-500 hover:text-amber-400 p-1 bg-slate-800 rounded transition-colors shrink-0"><Info size={14}/></button>
                                                    </div>
                                                    <input className="w-full bg-transparent border-none p-0 text-[10px] text-slate-400 focus:ring-0 truncate mt-1" value={item.notes} onChange={(e) => updateInventory(item.id, 'notes', e.target.value)} placeholder="Short notes..." />
                                                </div>
                                                <button onClick={() => deleteItem(item.id)} className="text-slate-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 shrink-0"><Trash2 size={16}/></button>
                                            </div>
                                        ))}
                                        {char.inventory.length === 0 && <p className="text-center text-sm text-slate-500 italic py-4">Inventory is empty.</p>}
                                    </div>
                                    <div className="grid grid-cols-5 gap-2 mt-5 pt-4 border-t border-slate-700/50 bg-slate-900/30 p-3 rounded-xl">
                                        {['cp','sp','ep','gp','pp'].map(curr => ( 
                                            <div key={curr} className="flex flex-col items-center">
                                                <span className="text-[10px] uppercase text-slate-400 font-bold mb-1">{curr}</span>
                                                <input type="number" className="w-full text-center text-sm font-mono font-bold bg-slate-800 border border-slate-600 rounded p-1.5 focus:border-amber-500 text-white" value={char.coins[curr]} onChange={(e) => updateChar('coins', {...char.coins, [curr]: parseInt(e.target.value)})} />
                                            </div> 
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-panel p-5 rounded-2xl flex flex-col min-h-[400px]">
                                    <h3 className="font-bold text-slate-200 flex items-center gap-2 border-b border-slate-700/50 pb-3 mb-4"><Scroll size={18} className="text-indigo-400"/> Notes & Bio</h3>
                                    <textarea className="flex-1 input-base resize-none leading-relaxed h-full" placeholder="Character backstory, session notes, active quests, or personality traits..." value={char.notes} onChange={(e) => updateChar('notes', e.target.value)}></textarea>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {/* DICE BAG FAB */}
                    {view !== 'list' && (
                        <button onClick={() => setDiceBagOpen(true)} className="fixed bottom-6 right-6 z-40 w-16 h-16 bg-gradient-to-br from-fuchsia-500 to-purple-600 rounded-full shadow-[0_10px_25px_rgba(192,38,211,0.5)] flex items-center justify-center text-white hover:scale-110 hover:shadow-[0_15px_35px_rgba(192,38,211,0.7)] transition-all border-2 border-fuchsia-300/30 group">
                            <D20 size={32} className="group-hover:rotate-12 transition-transform duration-300" />
                        </button>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
