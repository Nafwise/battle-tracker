    <style>
        :root {
            --bg-deep: #020617;
            --accent: #d946ef; /* Fuchsia-500 */
            --border: #334155;
        }

        body { 
            background-color: var(--bg-deep); 
            color: #F8FAFC; 
            font-family: ui-sans-serif, system-ui, sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, #2e1065 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Unified UI Classes */
        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .input-base {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: white;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            transition: all 0.2s ease;
            width: 100%;
        }
        .input-base:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(217, 70, 239, 0.2);
            background-color: rgba(15, 23, 42, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #c026d3, #9333ea);
            color: white;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px -3px rgba(192, 38, 211, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px -3px rgba(192, 38, 211, 0.6); }
        .btn-primary:active { transform: translateY(1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background-color: rgba(30, 41, 59, 0.8);
            color: #cbd5e1;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            border: 1px solid #475569;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-secondary:hover { background-color: rgba(51, 65, 85, 0.9); color: white; border-color: #64748b; transform: translateY(-1px); }
        .btn-secondary:active { transform: translateY(1px); }

        .btn-danger {
            background-color: rgba(127, 29, 29, 0.3);
            color: #fca5a5;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(153, 27, 27, 0.5);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-danger:hover { background-color: rgba(220, 38, 38, 0.8); color: white; border-color: #ef4444; }

        /* Stat Hexagon */
        .stat-hex { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }

        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        summary::-webkit-details-marker { display: none; }

        /* Dropdown Colors */

        ];

        const getMod = (score) => Math.floor((score - 10) / 2);
        const formatMod = (score) => { const m = getMod(score); return m >= 0 ? `+${m}` : `${m}`; };
        const getProficiency = (level) => Math.ceil(level / 4) + 1;

        // --- 3D DICE TRAY COMPONENT ---
        const DiceTray = ({ isOpen, onClose, rollRequest, onRollComplete }) => {
            const containerRef = useRef(null);
            const isRollingRef = useRef(false); 
            const [lastResult, setLastResult] = useState(null);

            useEffect(() => {
                if (!isOpen || !containerRef.current) return;

                let frameId;
                let renderer, scene, camera, world, bodies = [], meshes = [];
                let isSetup = false;

                const setupEngine = () => {
                    const width = containerRef.current.clientWidth;
                    const height = containerRef.current.clientHeight;
                    // Wait until the container has actual dimensions in the DOM before rendering
                    if (width === 0 || height === 0) {
                        frameId = requestAnimationFrame(setupEngine);
                        return;
                    }
                    isSetup = true;

                    // --- Cannon.js Physics ---
                    world = new CANNON.World();
                    world.gravity.set(0, -40, 0); // Fast snappy gravity
                    world.broadphase = new CANNON.NaiveBroadphase();
                    world.solver.iterations = 10;
                    
                    const diceBodyMat = new CANNON.Material();
                    const floorBodyMat = new CANNON.Material();
                    const contactMat = new CANNON.ContactMaterial(floorBodyMat, diceBodyMat, { friction: 0.3, restitution: 0.4 });
                    world.addContactMaterial(contactMat);
                    world.allowSleep = true; 

                    // --- Three.js Scene ---
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
                    camera.position.set(0, 18, 12);
                    camera.lookAt(0, 0, 0);

                    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                    renderer.setSize(width, height);
                    renderer.shadowMap.enabled = true;
                    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                    containerRef.current.innerHTML = '';
                    containerRef.current.appendChild(renderer.domElement);

                    // Lighting
                    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                    dirLight.position.set(5, 15, 5);
                    dirLight.castShadow = true;
                    scene.add(dirLight);

                    // Floor & Walls
                    const floorBody = new CANNON.Body({ mass: 0, material: floorBodyMat });
                    floorBody.addShape(new CANNON.Plane());
                    floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                    world.addBody(floorBody);

                    const createWall = (x, z, w, h, d) => {
                        const wallBody = new CANNON.Body({ mass: 0, material: floorBodyMat });
                        wallBody.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)));
                        wallBody.position.set(x, h/2, z);
                        world.addBody(wallBody);
                    };
                    createWall(0, -7, 20, 10, 1); createWall(0, 7, 20, 10, 1);
                    createWall(-9, 0, 1, 10, 20); createWall(9, 0, 1, 10, 20);

                    // Add Dice
                    if (rollRequest) {
                        isRollingRef.current = true; setLastResult(null);
                        const groups = rollRequest.dice.split('+');
                        let dieIndex = 0;
                        groups.forEach(g => {
                            const parts = g.trim().toLowerCase().split('d');
                            if (parts.length === 2) {
                                const count = parseInt(parts[0]) || 1;
                                const sides = parseInt(parts[1]) || 20;
                                for(let i=0; i<count; i++) {
                                    let geo, shape;
                                    if (sides === 4) { geo = new THREE.TetrahedronGeometry(1.2); shape = new CANNON.Sphere(0.9); }
                                    else if (sides === 6) { geo = new THREE.BoxGeometry(1.6, 1.6, 1.6); shape = new CANNON.Box(new CANNON.Vec3(0.8, 0.8, 0.8)); }
                                    else if (sides === 8) { geo = new THREE.OctahedronGeometry(1.1); shape = new CANNON.Sphere(0.9); }
                                    else if (sides === 10) { geo = new THREE.IcosahedronGeometry(1.1); shape = new CANNON.Sphere(0.95); }
                                    else if (sides === 12) { geo = new THREE.DodecahedronGeometry(1.1); shape = new CANNON.Sphere(1); }
                                    else { geo = new THREE.IcosahedronGeometry(1.2); shape = new CANNON.Sphere(1); }
                                    
                                    // Hollow glowing neon laser edges
                                    const edgesGeo = new THREE.EdgesGeometry(geo);
                                    const edgesMat = new THREE.LineBasicMaterial({ color: 0xd946ef });
                                    const mesh = new THREE.LineSegments(edgesGeo, edgesMat);

                                    scene.add(mesh); meshes.push(mesh);
                                    
                                    const body = new CANNON.Body({ 
                                        mass: 1, material: diceBodyMat, shape: shape,
                                        linearDamping: 0.4, angularDamping: 0.4, allowSleep: true, sleepSpeedLimit: 1.0, sleepTimeLimit: 0.1
                                    });
                                    body.position.set((Math.random()-0.5)*4 + (dieIndex%3-1)*1.5, 10 + (dieIndex*1.5), (Math.random()-0.5)*4 + Math.floor(dieIndex/3)*1.5);
                                    body.angularVelocity.set((Math.random()-0.5)*30, (Math.random()-0.5)*30, (Math.random()-0.5)*30);
                                    body.velocity.set((Math.random()-0.5)*5, -20, (Math.random()-0.5)*5);
                                    world.addBody(body); bodies.push({ body, mesh, sides });
                                    dieIndex++;
                                }
                            }
                        });
                    }

                    // Loop
                    let stoppedFrames = 0;
                    let lastTime = performance.now();
                    const animate = (time) => {
                        frameId = requestAnimationFrame(animate);
                        const dt = (time - lastTime) / 1000;
                        lastTime = time;
                        world.step(1/60, Math.min(dt, 0.1), 3);

                        let allStopped = true;
                        for (let i = 0; i < meshes.length; i++) {
                            meshes[i].position.copy(bodies[i].body.position);
                            meshes[i].quaternion.copy(bodies[i].body.quaternion);
                            if (bodies[i].body.sleepState !== CANNON.Body.SLEEPING && (bodies[i].body.velocity.length() > 0.1 || bodies[i].body.angularVelocity.length() > 0.5)) allStopped = false;
                        }

                        if (meshes.length > 0 && allStopped) {
                            stoppedFrames++;
                            if (stoppedFrames > 10 && isRollingRef.current) { 
                                isRollingRef.current = false; 
                                const rolls = bodies.map(b => Math.floor(Math.random() * b.sides) + 1);
                                bodies.forEach(b => b.body.sleep());
                                
                                bodies.forEach((b, idx) => {
                                    const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
                                    const ctx = canvas.getContext('2d');
                                    ctx.font = "bold 70px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                                    ctx.shadowColor = "#d946ef"; ctx.shadowBlur = 10; ctx.fillStyle = "white";
                                    ctx.fillText(rolls[idx].toString(), 64, 64);
                                    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0 }));
                                    sprite.position.copy(b.body.position); sprite.position.y += 2.2; sprite.scale.set(3,3,3);
                                    scene.add(sprite);
                                    let op = 0; const anim = setInterval(() => { op += 0.1; if(op >= 1) clearInterval(anim); sprite.material.opacity = op; }, 16);
                                });

                                const total = rolls.reduce((a,b)=>a+b,0);
                                const res = { rolls, total, mod: rollRequest.mod, label: rollRequest.label };
                                setLastResult(res);
                                onRollComplete && onRollComplete(res);
                            }
                        } else { stoppedFrames = 0; }
                        renderer.render(scene, camera);
                    };
                    frameId = requestAnimationFrame(animate);
                };

                setupEngine();

                const handleResize = () => {
                    if (!containerRef.current || !isSetup) return;
                    const w = containerRef.current.clientWidth;
                    const h = containerRef.current.clientHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(frameId);
                    window.removeEventListener('resize', handleResize);
                    if (containerRef.current) containerRef.current.innerHTML = '';
                    if (renderer) {
                        renderer.dispose();
                        scene.traverse((obj) => {
                            if (obj.geometry) obj.geometry.dispose();
                            if (obj.material) {
                                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                                else obj.material.dispose();
                            }
                        });
                    }
                };
            }, [isOpen, rollRequest]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-end justify-center pointer-events-none">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm pointer-events-auto" onClick={onClose}></div>
                    <div className="relative w-full max-w-3xl h-[60vh] bg-slate-900 border-t border-fuchsia-500/50 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] overflow-hidden pointer-events-auto flex flex-col animate-slide-up">
                        <div className="absolute top-4 left-4 right-4 flex justify-between items-start z-10">
                            <div className="bg-slate-900/80 backdrop-blur-md p-3 rounded-xl border border-slate-700/50 shadow-lg">
                                <h2 className="text-fuchsia-400 font-bold text-lg uppercase tracking-wider">{rollRequest?.label || "Dice Tray"}</h2>
                                <div className="text-sm text-slate-300 font-mono mt-1 bg-slate-950 px-2 py-1 rounded inline-block border border-slate-800">
                                    {rollRequest?.dice} {rollRequest?.mod > 0 ? `+ ${rollRequest.mod}` : (rollRequest?.mod < 0 ? `- ${Math.abs(rollRequest.mod)}` : '')}
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 bg-slate-800/80 backdrop-blur rounded-full text-slate-400 hover:text-white hover:bg-red-500/80 transition-all border border-slate-600 hover:border-red-400"><XIcon size={24}/></button>
                        </div>
                        <div ref={containerRef} className="flex-1 w-full bg-gradient-to-b from-slate-900 to-indigo-950"></div>
                        {!isRollingRef.current && lastResult && (
                            <div className="absolute inset-x-0 bottom-20 flex justify-center pointer-events-none z-20">
                                <div className="bg-slate-900/90 backdrop-blur-xl border border-fuchsia-500/50 px-10 py-6 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.6)] flex flex-col items-center animate-slide-up pointer-events-auto transform hover:scale-105 transition-transform">
                                    <div className="text-xs text-slate-400 uppercase tracking-widest mb-1 font-bold">Total Result</div>
                                    <div className="text-6xl font-black text-white filter drop-shadow-[0_0_15px_rgba(217,70,239,0.6)] mb-2">
                                        {lastResult.total + lastResult.mod}
                                    </div>
                                    <div className="text-fuchsia-300 font-mono text-xs opacity-80">
                                        [{lastResult.rolls.join(', ')}] {lastResult.mod > 0 ? `+ ${lastResult.mod}` : (lastResult.mod < 0 ? `- ${Math.abs(lastResult.mod)}` : '')}
                                    </div>
                                    {lastResult.label === "Short Rest (Hit Die)" ? (
                                        <button onClick={onClose} className="mt-4 btn-primary w-full">Apply Healing & Close</button>
                                    ) : (
                                        <button onClick={onClose} className="mt-4 btn-secondary w-full">Dismiss Tray</button>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- DICE BAG MODAL ---
        const DiceBagModal = ({ isOpen, onClose, onRoll }) => {
            const [dice, setDice] = useState({ 4: 0, 6: 0, 8: 0, 10: 0, 12: 0, 20: 0 });
            const [mod, setMod] = useState(0);

            if (!isOpen) return null;

            const totalDice = Object.values(dice).reduce((a,b)=>a+b,0);
            
            const handleRoll = () => {
                if (totalDice === 0) {
                    onRoll("Custom Roll", "1d20", mod); // Fallback if empty
                } else {
                    const str = Object.entries(dice).filter(([k,v]) => v > 0).map(([k,v]) => `${v}d${k}`).join(' + ');
                    onRoll("Custom Roll", str, mod);
                }
                onClose();
                setDice({ 4: 0, 6: 0, 8: 0, 10: 0, 12: 0, 20: 0 });
                setMod(0);
            };

            const modDie = (sides, amt) => setDice(p => ({...p, [sides]: Math.max(0, p[sides] + amt)}));

            return (
                <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 backdrop-blur-sm p-4 animate-fadeIn">
                    <div className="bg-slate-900 border border-slate-700 rounded-t-2xl w-full max-w-md p-6 shadow-2xl relative animate-slide-up mb-16">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={20}/></button>
                        <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><Dices className="text-fuchsia-500" /> Dice Bag</h2>
                        
                        <div className="grid grid-cols-3 gap-3 mb-6">
                            {[4, 6, 8, 10, 12, 20].map(d => (
                                <div key={d} className="bg-slate-800/50 border border-slate-700 rounded-xl p-3 flex flex-col items-center gap-2 relative overflow-hidden">
                                    {dice[d] > 0 && <div className="absolute top-0 right-0 bg-fuchsia-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-bl-lg">{dice[d]}</div>}
                                    <span className="text-slate-300 font-bold">d{d}</span>
                                    <div className="flex gap-1 w-full">
                                        <button onClick={() => modDie(d, -1)} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white rounded text-sm py-1">-</button>
                                        <button onClick={() => modDie(d, 1)} className="flex-1 bg-fuchsia-900/50 hover:bg-fuchsia-600 text-fuchsia-300 hover:text-white rounded text-sm py-1">+</button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="flex items-center gap-3 mb-6 bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <span className="text-sm font-bold text-slate-300 flex-1">Modifier (Flat Bonus)</span>
                            <div className="flex items-center gap-2">
                                <button onClick={()=>setMod(m=>m-1)} className="w-8 h-8 bg-slate-700 rounded text-white font-bold hover:bg-slate-600">-</button>
                                <input type="number" className="w-12 bg-transparent text-center text-lg font-bold text-white border-none p-0 focus:ring-0" value={mod} onChange={e=>setMod(parseInt(e.target.value)||0)} />
                                <button onClick={()=>setMod(m=>m+1)} className="w-8 h-8 bg-slate-700 rounded text-white font-bold hover:bg-slate-600">+</button>
                            </div>
                        </div>

                        <button onClick={handleRoll} className="w-full btn-primary py-3 text-lg rounded-xl">
                            {totalDice > 0 ? `Roll ${totalDice} Dice` : "Quick Roll 1d20"}
                        </button>
                    </div>
                </div>
            );
        };

        // --- CUSTOM TOAST/CONFIRM SYSTEM ---
        const DialogOverlay = ({ confirmDialog, setConfirmDialog, toast }) => {
            if (!confirmDialog && !toast) return null;
            return (
                <>
                    {/* Toast */}
                    {toast && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[200] bg-slate-800 border border-fuchsia-500/50 text-white px-6 py-3 rounded-full shadow-[0_5px_20px_rgba(0,0,0,0.5)] flex items-center gap-3 animate-slide-up">
                            <Sparkles size={16} className="text-fuchsia-400" />
                            <span className="font-bold text-sm">{toast}</span>
                        </div>
                    )}
                    {/* Confirm */}
                    {confirmDialog && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-sm p-6 shadow-2xl relative animate-slide-up">
                                <h3 className="text-lg font-bold text-white mb-2">{confirmDialog.title}</h3>
                                <p className="text-slate-300 text-sm mb-6 leading-relaxed">{confirmDialog.msg}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="btn-secondary">Cancel</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="btn-danger">{confirmDialog.actionText || "Confirm"}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // --- SUITE DROPDOWN COMPONENT ---
        const SuiteDropdown = () => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="relative" ref={dropdownRef}>
                    <button onClick={() => setIsOpen(!isOpen)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-slate-800 transition-colors text-slate-300 hover:text-white border border-slate-700 ${isOpen ? 'bg-slate-800 text-white shadow-inner' : ''}`}>
                        <User size={16} className="text-fuchsia-400" />
                        <span className="text-sm font-bold hidden sm:inline">Suite Navigation</span>
                        <ChevronDown size={14} className={`transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}/>
                    </button>
                    
                    <div className={`absolute top-full left-0 mt-2 w-64 bg-slate-900/95 backdrop-blur-xl rounded-xl shadow-2xl border border-slate-700 overflow-hidden py-2 flex flex-col gap-1 z-[100] transition-all duration-200 origin-top-left ${isOpen ? 'opacity-100 scale-100 translate-y-0 pointer-events-auto' : 'opacity-0 scale-95 -translate-y-2 pointer-events-none'}`}>
                        <div className="px-4 py-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Apps</div>
                        <a href="./tome.html" className="suite-item tracker-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50"><Crosshair size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Tracker</span><span className="text-[10px] opacity-60">Initiative & Combat</span></div></a>
                        <a href="./map.html" className="suite-item map-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50"><MapIcon size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Atlas</span><span className="text-[10px] opacity-60">Tactical Maps</span></div></a>
                        <div className="suite-item border-l-4 border-fuchsia-500 bg-slate-800/50 flex items-center gap-3 px-4 py-3 text-white"><User size={18} className="text-fuchsia-400" /><div className="flex flex-col"><span className="text-sm font-bold">Records</span><span className="text-[10px] opacity-60">Character Sheets</span></div></div>
                        <a href="./homebrew.html" className="suite-item workshop-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50"><FlaskConical size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Workshop</span><span className="text-[10px] opacity-60">Monster Creator</span></div></a>
                        <a href="./origins.html" className="suite-item genesis-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50"><Dna size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Genesis</span><span className="text-[10px] opacity-60">Class & Race Creator</span></div></a>
                        <a href="./token.html" className="suite-item forge-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50"><Hammer size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Astral Forge</span><span className="text-[10px] opacity-60">3D Token Maker</span></div></a>
                        <a href="./loot.html" className="suite-item loot-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50"><Coins size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Loot</span><span className="text-[10px] opacity-60">Treasury</span></div></a>
                        <a href="./campaign.html" className="suite-item campaign-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50"><Flag size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Campaign</span><span className="text-[10px] opacity-60">Adventure Module</span></div></a>
                        <a href="./compendium.html" className="suite-item compendium-hover flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800/50 border-t border-slate-700"><BookOpen size={18} className="text-slate-400" /><div className="flex flex-col"><span className="text-sm font-bold">Compendium</span><span className="text-[10px] opacity-60">Rules & Spells</span></div></a>
                    </div>
                </div>
            );
        };

        // --- STAT BOX WRAPPER ---
        const StatBox = ({ label, value, onChange, onRoll, size = "md" }) => {
            const mod = formatMod(value);
            return (
                <div className="flex flex-col items-center">
                    <div className="text-xs uppercase font-bold text-slate-400 mb-1">{label}</div>
                    <div className="relative flex items-center justify-center group">
                        <div onClick={() => onRoll(label, `1d20`, getMod(value))} className={`stat-hex bg-slate-800 border border-slate-600 ${size === "lg" ? "w-20 h-24" : "w-16 h-20"} flex flex-col items-center justify-center shadow-inner cursor-pointer hover:border-fuchsia-500 hover:bg-slate-700 transition-colors`}>
                            <span className="text-xl font-black text-white z-10 group-hover:scale-110 transition-transform">{mod}</span>
                            <div className="z-10 mt-1" onClick={(e)=>e.stopPropagation()}>
                                <input type="number" value={value} onChange={(e) => onChange(parseInt(e.target.value) || 10)} className="w-8 text-center bg-transparent border-0 text-[10px] text-slate-400 focus:ring-0 p-0 focus:text-white" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SkillRow = ({ skill, char, onCycle }) => {
            const modVal = getMod(char.stats[skill.stat]);
            const isProf = (char.proficiencies || []).includes(skill.name);
            const isExpert = (char.expertise || []).includes(skill.name);
            const pb = getProficiency(char.level);
            
            let total = modVal;
            if (isExpert) total += (pb * 2);
            else if (isProf) total += pb;
            
            let dotClass = 'border-slate-600 group-hover:border-slate-400';
            if (isExpert) dotClass = 'bg-yellow-500 border-yellow-500 shadow-[0_0_5px_rgba(234,179,8,0.6)]';
            else if (isProf) dotClass = 'bg-fuchsia-500 border-fuchsia-500';
            
            return (
                <div className="flex items-center justify-between text-sm py-1.5 border-b border-slate-800/50 hover:bg-slate-800/30 rounded px-2 group cursor-pointer transition-colors" onClick={() => onCycle(skill.name)}>
                    <div className="flex items-center gap-3">
                        <div className={`w-3 h-3 rounded-full border transition-colors ${dotClass}`} />
                        <span className="text-slate-300 font-medium group-hover:text-white">{skill.name} <span className="text-[10px] text-slate-500 uppercase ml-1">({skill.stat})</span></span>
                    </div>
                    <span className={`font-mono font-bold px-2 py-0.5 rounded ${total >= 0 ? (isExpert ? 'text-yellow-400 bg-yellow-900/20' : 'text-fuchsia-300 bg-fuchsia-900/20') : 'text-slate-400 bg-slate-800'}`}>
                        {total >= 0 ? `+${total}` : total}
                    </span>
                </div>
            );
        };

        // --- STAT ASSIGNER MODAL ---
        const StatAssignerModal = ({ char, onClose, onApply }) => {
            const STANDARD_ARRAY = [15, 14, 13, 12, 10, 8];
            const [pool, setPool] = useState([...STANDARD_ARRAY]);
            const [assigned, setAssigned] = useState({ str: null, dex: null, con: null, int: null, wis: null, cha: null });

            const rollStats = () => {
                const roll = () => {
                    let r = [Math.ceil(Math.random()*6), Math.ceil(Math.random()*6), Math.ceil(Math.random()*6), Math.ceil(Math.random()*6)];
                    r.sort((a,b)=>a-b);
                    return r[1] + r[2] + r[3];
                };
                setPool([roll(), roll(), roll(), roll(), roll(), roll()].sort((a,b)=>b-a));
                setAssigned({ str: null, dex: null, con: null, int: null, wis: null, cha: null });
            };

            const resetStandard = () => {
                setPool([...STANDARD_ARRAY]);
                setAssigned({ str: null, dex: null, con: null, int: null, wis: null, cha: null });
            };

            const unassign = (stat) => setAssigned(prev => ({...prev, [stat]: null}));
            const assign = (stat, poolIndex) => setAssigned(prev => ({...prev, [stat]: poolIndex}));

            const apply = () => {
                let newStats = { ...char.stats };
                for (let stat in assigned) {
                    if (assigned[stat] !== null) newStats[stat] = pool[assigned[stat]];
                }
                onApply(newStats);
                onClose();
            };

            const allAssigned = Object.values(assigned).every(v => v !== null);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl relative animate-slide-up">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={16}/></button>
                        <h2 className="text-xl font-bold text-white mb-2 flex items-center gap-2"><Dices className="text-fuchsia-500" /> Assign Stats</h2>
                        <p className="text-xs text-slate-400 mb-4">Generate an array and click to assign them to your attributes.</p>
                        
                        <div className="flex gap-2 mb-6">
                            <button onClick={resetStandard} className="flex-1 btn-secondary text-xs">Standard Array</button>
                            <button onClick={rollStats} className="flex-1 bg-fuchsia-900/30 hover:bg-fuchsia-800/50 text-fuchsia-300 rounded-lg text-xs font-bold border border-fuchsia-700/50 transition-colors flex items-center justify-center gap-1"><Dices size={12}/> Roll 4d6 Drop 1</button>
                        </div>

                        <div className="flex justify-between gap-1 mb-6 px-2">
                            {pool.map((val, idx) => {
                                const isUsed = Object.values(assigned).includes(idx);
                                return (
                                    <div key={idx} className={`w-10 h-10 flex flex-col items-center justify-center rounded-lg font-black text-lg border-2 transition-all ${isUsed ? 'bg-slate-800 border-slate-700 text-slate-600' : 'bg-fuchsia-600 border-fuchsia-400 text-white shadow-[0_0_10px_rgba(217,70,239,0.4)]'}`}>
                                        {val}
                                    </div>
                                );
                            })}
                        </div>

                        <div className="space-y-2 mb-6">
                            {['str','dex','con','int','wis','cha'].map(stat => (
                                <div key={stat} className="flex justify-between items-center bg-slate-800/50 border border-slate-700 p-2 rounded-lg">
                                    <span className="uppercase font-bold text-slate-300 w-12 ml-2">{stat}</span>
                                    {assigned[stat] !== null ? (
                                        <div className="flex items-center gap-3">
                                            <span className="text-xl font-black text-white bg-slate-900 px-3 py-0.5 rounded border border-slate-600">{pool[assigned[stat]]}</span>
                                            <button onClick={() => unassign(stat)} className="text-slate-500 hover:text-red-400 p-1 bg-slate-800 rounded hover:bg-red-900/20 transition-colors"><XIcon size={14}/></button>
                                        </div>
                                    ) : (
                                        <div className="flex gap-1">
                                            {pool.map((val, idx) => {
                                                if (Object.values(assigned).includes(idx)) return null;
                                                return <button key={idx} onClick={() => assign(stat, idx)} className="w-8 h-8 bg-slate-700 hover:bg-fuchsia-600 text-white rounded font-bold transition-colors shadow-sm">{val}</button>
                                            })}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        <button onClick={apply} disabled={!allAssigned} className="w-full py-3 btn-primary disabled:bg-slate-800 disabled:border-slate-700 disabled:text-slate-500">
                            {allAssigned ? "Apply Stats to Character" : "Assign all stats to apply"}
                        </button>
                    </div>
                </div>
            );
        };

        // --- REST MODAL COMPONENT ---
        const RestModal = ({ char, onClose, onShortRest, onLongRest, setDieSize }) => {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl relative animate-slide-up">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={16}/></button>
                        <h2 className="text-2xl font-bold text-white mb-1 flex items-center gap-2"><Flame className="text-orange-500" /> Rest</h2>
                        <p className="text-slate-400 text-sm mb-6">Recover your strength and magical energy.</p>
                        
                        <div className="space-y-4">
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 hover:border-yellow-900/50 transition-colors">
                                <div className="flex justify-between items-start mb-2">
                                    <div className="flex items-center gap-2"><Sun className="text-yellow-400" size={18} /> <span className="font-bold text-slate-200">Short Rest</span></div>
                                    <span className="text-xs font-bold text-slate-500 bg-slate-900 px-2 py-1 rounded">1 Hour</span>
                                </div>
                                <p className="text-xs text-slate-400 mb-4">Spend Hit Dice to regain Hit Points.</p>
                                <div className="flex items-center justify-between gap-3 mb-4 bg-slate-900 p-2 rounded-lg border border-slate-700/50">
                                    <div className="text-sm text-slate-300">Hit Dice: <span className="font-bold text-white ml-1">{char.hp.hitDiceCurrent} / {char.level}</span></div>
                                    <select className="input-base w-auto text-xs py-1" value={char.hp.hitDieSize || 8} onChange={(e) => setDieSize(parseInt(e.target.value))}>
                                        <option value="6">d6</option><option value="8">d8</option><option value="10">d10</option><option value="12">d12</option>
                                    </select>
                                </div>
                                <button onClick={onShortRest} disabled={char.hp.hitDiceCurrent <= 0} className="w-full btn-secondary text-yellow-100 hover:text-white hover:bg-yellow-600 hover:border-yellow-500">
                                    {char.hp.hitDiceCurrent > 0 ? "Roll Hit Die" : "No Hit Dice Left"}
                                </button>
                            </div>

                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 hover:border-indigo-900/50 transition-colors">
                                <div className="flex justify-between items-start mb-2">
                                    <div className="flex items-center gap-2"><Moon className="text-indigo-400" size={18} /> <span className="font-bold text-slate-200">Long Rest</span></div>
                                    <span className="text-xs font-bold text-slate-500 bg-slate-900 px-2 py-1 rounded">8 Hours</span>
                                </div>
                                <p className="text-xs text-slate-400 mb-4">Regain all HP, half Hit Dice, and reset spell slots.</p>
                                <button onClick={onLongRest} className="w-full btn-secondary text-indigo-200 hover:text-white hover:bg-indigo-600 hover:border-indigo-500">
                                    Take Long Rest
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- WEAPON PICKER MODAL ---
        const WeaponPickerModal = ({ char, onClose, onAddAttack }) => {
            const [selectedWeapon, setSelectedWeapon] = useState(WEAPONS[0]);
            const [magicBonus, setMagicBonus] = useState(0);
            const [isProficient, setIsProficient] = useState(true);
            const importRef = useRef(null);

            const handleAdd = () => {
                const pb = getProficiency(char.level);
                let stat = "str";
                if (selectedWeapon.range && !selectedWeapon.type.includes("Thrown")) stat = "dex";
                if (selectedWeapon.finesse && char.stats.dex > char.stats.str) stat = "dex";
                
                const mod = getMod(char.stats[stat]);
                const totalBonus = mod + (isProficient ? pb : 0) + parseInt(magicBonus || 0);
                const damageBonus = mod + parseInt(magicBonus || 0);
                
                const damageString = `${selectedWeapon.damage}${damageBonus >= 0 ? '+'+damageBonus : damageBonus}`;
                const nameString = `${selectedWeapon.name}${parseInt(magicBonus) > 0 ? ` +${magicBonus}` : ''}`;

                onAddAttack({ id: `atk-${Date.now()}`, name: nameString, bonus: `+${totalBonus}`, damage: damageString, type: selectedWeapon.type, level: 1 });
                onClose();

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-sm p-6 shadow-2xl relative animate-slide-up">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={16}/></button>
                        <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><Sword className="text-fuchsia-500" /> Add Weapon</h2>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="text-[10px] uppercase font-bold text-slate-500 block mb-1">Standard Weapons</label>
                                <select className="input-base" value={selectedWeapon.name} onChange={(e) => setSelectedWeapon(WEAPONS.find(w => w.name === e.target.value))}>
                                    {WEAPONS.map(w => <option key={w.name} value={w.name}>{w.name}</option>)}
                                </select>
                            </div>
                            
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 block mb-1">Magic Bonus</label>
                                    <input type="number" className="input-base" placeholder="+0" value={magicBonus} onChange={e => setMagicBonus(e.target.value)} />
                                </div>
                                <div className="flex-1 flex items-center pt-4">
                                    <label className="flex items-center gap-2 text-sm text-slate-300 cursor-pointer bg-slate-800/50 p-2 rounded-lg border border-slate-700 w-full justify-center hover:bg-slate-800 transition-colors">
                                        <input type="checkbox" checked={isProficient} onChange={e => setIsProficient(e.target.checked)} className="rounded border-slate-600 bg-slate-900 text-fuchsia-500 focus:ring-0" />

                            <button onClick={handleAdd} className="w-full py-3 mt-2 btn-primary">Add Standard Weapon</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ARMOR PICKER MODAL ---
        const ArmorPickerModal = ({ char, onClose, onEquip }) => {
            const [selectedArmor, setSelectedArmor] = useState(ARMOR[1]);
            const [hasShield, setHasShield] = useState(false);
            const [magicBonus, setMagicBonus] = useState(0);

            const handleEquip = () => {
                const dexMod = getMod(char.stats.dex);
                let baseAC = selectedArmor.ac;
                if (selectedArmor.type === "Light") baseAC += dexMod;
                else if (selectedArmor.type === "Medium") baseAC += Math.min(dexMod, 2);
                let totalAC = baseAC + (hasShield ? 2 : 0) + parseInt(magicBonus || 0);
                onEquip(totalAC);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-sm p-6 shadow-2xl relative animate-slide-up">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={16}/></button>
                        <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><Shield className="text-cyan-500" /> Equip Armor</h2>
                        <div className="space-y-4">
                            <div>
                                <label className="text-[10px] uppercase font-bold text-slate-500 block mb-1">Armor Base</label>
                                <select className="input-base" value={selectedArmor.name} onChange={(e) => setSelectedArmor(ARMOR.find(a => a.name === e.target.value))}>
                                    {ARMOR.filter(a => a.type !== 'Shield').map(a => <option key={a.name} value={a.name}>{a.name} ({a.type}, Base AC {a.ac})</option>)}
                                </select>
                            </div>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 block mb-1">Magic Bonus</label>
                                    <input type="number" className="input-base" placeholder="+0" value={magicBonus} onChange={e => setMagicBonus(e.target.value)} />
                                </div>
                                <div className="flex-1 flex items-center pt-4">
                                    <label className="flex items-center gap-2 text-sm text-slate-300 cursor-pointer bg-slate-800/50 p-2 rounded-lg border border-slate-700 w-full justify-center hover:bg-slate-800 transition-colors">
                                        <input type="checkbox" checked={hasShield} onChange={e => setHasShield(e.target.checked)} className="rounded border-slate-600 bg-slate-900 text-cyan-500 focus:ring-0" />
                                        <span className="font-bold">+2 Shield</span>
                                    </label>
                                </div>
                            </div>
                            <button onClick={handleEquip} className="w-full py-3 mt-2 btn-primary bg-gradient-to-r from-cyan-600 to-blue-600 shadow-cyan-600/40 border-cyan-500/30 hover:shadow-cyan-500/60">Calculate & Set AC</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ITEM DETAIL MODAL ---
        const ItemDetailModal = ({ item, onClose }) => (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={onClose}>
                <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-lg p-6 shadow-2xl relative animate-slide-up max-h-[80vh] flex flex-col" onClick={e => e.stopPropagation()}>
                    <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={16}/></button>
                    <div className="flex items-center gap-3 pr-8 mb-4 border-b border-slate-700 pb-3">
                        <Backpack className="text-amber-500" size={24} />
                        <h2 className="text-xl font-bold text-white flex-1">{item.name}</h2>
                        {item.qty > 1 && <span className="text-[10px] font-bold bg-slate-800 border border-slate-600 text-slate-300 px-2 py-1 rounded">QTY: {item.qty}</span>}
                    </div>
                    <div className="flex-1 overflow-y-auto pr-2 hide-scrollbar">
                        <div className="text-sm text-slate-300 whitespace-pre-wrap leading-relaxed font-serif bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">
                            {item.notes || "No description provided for this item."}
                        </div>
                    </div>
                    <div className="mt-4 pt-4 flex justify-end">
                        <button onClick={onClose} className="btn-secondary px-6">Close</button>
                    </div>
                </div>
            </div>
        );

        // --- SPELL DETAIL MODAL ---
        const SpellDetailModal = ({ spell, onClose, onUpdate }) => {
            if (!spell) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-lg p-6 shadow-2xl relative animate-slide-up max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={16}/></button>
                        <div className="flex items-center gap-3 pr-8 mb-4 border-b border-slate-700 pb-3">
                            <Wand className="text-purple-400" size={24} />
                            <h2 className="text-xl font-bold text-white flex-1">{spell.name || "Unnamed Spell"}</h2>
                            <span className="text-[10px] font-bold bg-slate-800 border border-slate-600 text-slate-300 px-2 py-1 rounded uppercase">Level {spell.level}</span>
                        </div>
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <label className="text-[10px] text-slate-500 uppercase font-bold mb-1 block">Damage / Heal</label>
                                <input className="input-base text-sm py-1.5" value={spell.damage || ""} onChange={e => onUpdate('damage', e.target.value)} placeholder="e.g. 8d6" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 uppercase font-bold mb-1 block">Upcast (Per Lvl)</label>
                                <input className="input-base text-sm py-1.5" value={spell.upcast || ""} onChange={e => onUpdate('upcast', e.target.value)} placeholder="e.g. 1d6" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 uppercase font-bold mb-1 block">Save Required</label>
                                <select className="input-base text-sm py-1.5" value={spell.saveStat || ""} onChange={e => onUpdate('saveStat', e.target.value)}>
                                    <option value="">None</option>
                                    <option value="str">Strength</option>
                                    <option value="dex">Dexterity</option>
                                    <option value="con">Constitution</option>
                                    <option value="int">Intelligence</option>
                                    <option value="wis">Wisdom</option>
                                    <option value="cha">Charisma</option>
                                </select>
                            </div>
                            <div className="flex items-center pt-5">
                                <label className="flex items-center gap-2 text-sm text-slate-300 cursor-pointer bg-slate-800/50 p-1.5 rounded border border-slate-700 w-full justify-center hover:bg-slate-800 transition-colors">
                                    <input type="checkbox" checked={spell.isAttack || false} onChange={e => onUpdate('isAttack', e.target.checked)} className="rounded bg-slate-900 border-slate-600 text-purple-500 focus:ring-0" />
                                    <span className="font-bold text-[10px] uppercase">Attack Roll</span>
                                </label>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto pr-2 hide-scrollbar">
                            <label className="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Spell Description & Effects</label>
                            <textarea 
                                className="w-full h-48 input-base resize-none"
                                placeholder="Enter spell description, cast time, range, duration, secondary effects..."
                                value={spell.notes || ""}
                                onChange={(e) => onUpdate('notes', e.target.value)}
                            />
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-700 flex justify-end">
                            <button onClick={onClose} className="btn-primary px-8 py-2">Done</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- FEATURE DETAIL MODAL ---
        const FeatureDetailModal = ({ feature, onClose, onUpdate }) => {
            if (!feature) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-lg p-6 shadow-2xl relative animate-slide-up max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1 rounded-full"><XIcon size={16}/></button>

                        <div className="flex flex-col gap-2 mb-4 border-b border-slate-700 pb-4 pr-6">
                            <div className="flex items-center gap-3">
                                <div className="flex flex-col items-center bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
                                    <span className="text-[8px] text-slate-500 font-bold uppercase">Level</span>
                                    <input type="number" className="w-8 bg-transparent text-sm text-amber-400 font-bold text-center border-none p-0 focus:ring-0" value={feature.level || 1} onChange={e => onUpdate('level', parseInt(e.target.value))} />
                                </div>
                                <input className="flex-1 bg-transparent border-b border-transparent hover:border-slate-700 focus:border-amber-500 text-lg font-bold text-white rounded p-1 px-2 focus:bg-slate-800 transition-colors focus:outline-none focus:ring-0" value={feature.name} onChange={e => onUpdate('name', e.target.value)} placeholder="Feature Name" />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto pr-2 hide-scrollbar">
                            <label className="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Description & Rules</label>
                            <textarea
                                className="w-full h-48 input-base resize-none leading-relaxed"
                                placeholder="Enter feature description..."
                                value={feature.desc || ""}
                                onChange={(e) => onUpdate('desc', e.target.value)}
                            />
                        </div>

                        <div className="mt-4 pt-4 border-t border-slate-700 flex justify-end">
                            <button onClick={onClose} className="btn-primary bg-gradient-to-r from-amber-600 to-orange-600 shadow-amber-600/40 border-amber-500/30 px-8 py-2">Done</button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [characters, setCharacters] = useState(() => {
                const saved = localStorage.getItem('akashic_characters');
                let chars = saved ? JSON.parse(saved) : [DEFAULT_CHAR];
                chars = chars.map(c => {
                    if (c.inventory && Array.isArray(c.inventory)) {
                        const seenIds = new Set();
                        c.inventory = c.inventory.map(item => {
                            let newId = item.id;
                            if (!newId || typeof newId !== 'string' || seenIds.has(newId)) newId = `sanitized-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                            seenIds.add(newId);
                            return { ...item, id: newId };
                        });
                    }
                    return c;
                });
                return chars;
            });

            const [activeId, setActiveId] = useState(() => characters[0]?.id || 'default');
            const [view, setView] = useState('sheet'); 
            const [activeTab, setActiveTab] = useState('main'); 
            
            // UI States
            const [trayOpen, setTrayOpen] = useState(false);
            const [rollReq, setRollReq] = useState(null); 
            const [diceBagOpen, setDiceBagOpen] = useState(false);
            
            const [restModalOpen, setRestModalOpen] = useState(false);
            const [weaponModalOpen, setWeaponModalOpen] = useState(false);
            const [armorModalOpen, setArmorModalOpen] = useState(false);
            const [statModalOpen, setStatModalOpen] = useState(false);
            const [viewItem, setViewItem] = useState(null);
            const [viewSpell, setViewSpell] = useState(null);
            const [viewFeature, setViewFeature] = useState(null);
            const [castLevels, setCastLevels] = useState({}); 
            
            const [toast, setToast] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);
            
            const fileInputRef = useRef(null);
            const lootImportRef = useRef(null);
            const genesisImportRef = useRef(null);

            const char = useMemo(() => characters.find(c => c.id === activeId) || DEFAULT_CHAR, [characters, activeId]);
            if (!char.attunedItems) { char.attunedItems = ['', '', '']; }

            useEffect(() => { localStorage.setItem('akashic_characters', JSON.stringify(characters)); }, [characters]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // --- ACTIONS ---
            const updateChar = (field, value) => setCharacters(prev => prev.map(c => c.id === activeId ? { ...c, [field]: value } : c));
            const updateStat = (stat, val) => setCharacters(prev => prev.map(c => c.id === activeId ? { ...c, stats: { ...c.stats, [stat]: val } } : c));
            
            const cycleSkillProficiency = (skillName) => {
                const currentProf = char.proficiencies || [];
                const currentExp = char.expertise || [];
                if (currentExp.includes(skillName)) updateChar('expertise', currentExp.filter(p => p !== skillName));
                else if (currentProf.includes(skillName)) {
                    updateChar('proficiencies', currentProf.filter(p => p !== skillName));
                    updateChar('expertise', [...currentExp, skillName]);
                } else updateChar('proficiencies', [...currentProf, skillName]);
            };

            const toggleSave = (stat) => {
                const current = char.savingThrows || [];
                updateChar('savingThrows', current.includes(stat) ? current.filter(s => s !== stat) : [...current, stat]);
            };
            const updateHP = (type, val) => updateChar('hp', { ...char.hp, [type]: val });
            const updateDeathSave = (type, val) => {
                const saves = char.deathSaves || { successes: 0, failures: 0 };
                updateChar('deathSaves', { ...saves, [type]: val });
            };
            
            const addItem = () => updateChar('inventory', [...char.inventory, { id: `item-${Date.now()}`, name: "New Item", qty: 1, notes: "" }]);
            const addSpell = () => updateChar('spells', [...char.spells, { id: `spell-${Date.now()}`, name: "New Spell", level: 1, prepared: false, notes: "", damage: "", upcast: "", saveStat: "", isAttack: false }]);
            const addFeature = (type = 'class') => updateChar('features', [...(char.features || []), { id: `feat-${Date.now()}`, name: "New Feature", source: type, desc: "", level: char.level || 1, featureType: type }]);
            const addAttack = () => updateChar('attacks', [...char.attacks, { id: `atk-${Date.now()}`, name: "Weapon", bonus: "+0", damage: "1d8", type: "Slashing", level: char.level || 1 }]);
            
            const handleAddAttackFromModal = (newAttack) => updateChar('attacks', [...char.attacks, newAttack]);
            const addResource = () => updateChar('resources', [...(char.resources||[]), { id: `res-${Date.now()}`, name: "Resource", current: 1, max: 1 }]);

            const updateItemInArray = (arrName, id, field, val) => updateChar(arrName, (char[arrName] || []).map(i => i.id === id ? { ...i, [field]: val } : i));
            const deleteItemFromArray = (arrName, id) => updateChar(arrName, (char[arrName] || []).filter(i => i.id !== id));
            
            const updateInventory = (id, field, val) => updateItemInArray('inventory', id, field, val);
            const deleteItem = (id) => deleteItemFromArray('inventory', id);

            const createNewCharacter = () => {
                const newChar = { ...DEFAULT_CHAR, id: `char-${Date.now()}`, name: "New Hero" };
                setCharacters([...characters, newChar]);
                setActiveId(newChar.id);
                setView('sheet');
                showToast("Character created!");
            };
            
            const deleteCharacter = (id) => {
                setConfirmDialog({
                    title: "Delete Character",
                    msg: "Are you sure you want to permanently delete this character? This cannot be undone.",
                    actionText: "Delete Permanently",
                    onConfirm: () => {
                        let newChars = characters.filter(c => c.id !== id);
                        if (newChars.length === 0) newChars = [{ ...DEFAULT_CHAR, id: `char-${Date.now()}`, name: "New Hero" }];
                        setCharacters(newChars);
                        if (id === activeId || newChars.length === 1) setActiveId(newChars[0].id);
                        showToast("Character deleted.");
                    }
                });
            };

            const copyStatblock = () => {
                const pb = getProficiency(char.level);
                const statsTxt = Object.entries(char.stats).map(([k, v]) => `${k.toUpperCase()} ${v} (${formatMod(v)})`).join(' | ');
                const saves = (char.savingThrows || []).map(s => {
                    const mod = getMod(char.stats[s]);
                    const total = mod + pb;
                    return `${s.toUpperCase()} ${total >= 0 ? '+' : ''}${total}`;
                }).join(', ');
                
                const attacks = (char.attacks || []).map(a => `- ${a.name}: ${a.bonus} to hit, ${a.damage} ${a.type}`).join('\n');
                const text = `**${char.name}**\nLevel ${char.level} ${char.race} ${char.class}\nAC: ${char.ac} | HP: ${char.hp.current}/${char.hp.max} | Speed: ${char.speed}ft\n${statsTxt}\nSaves: ${saves || "None"}\nAttacks:\n${attacks || "- Unarmed"}`;

                const textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea); textArea.select();
                try { document.execCommand('copy'); showToast("Statblock copied to clipboard!"); } 
                catch (err) { showToast("Failed to copy statblock."); }
                document.body.removeChild(textArea);
            };

            const triggerRoll = (label, dice, mod) => { setRollReq({ label, dice, mod }); setTrayOpen(true); };

            const handleShortRestRoll = () => {
                if (char.hp.hitDiceCurrent > 0) {
                    const dieSize = char.hp.hitDieSize || 8;
                    const conMod = getMod(char.stats.con);
                    triggerRoll("Short Rest (Hit Die)", `1d${dieSize}`, conMod);
                    setRestModalOpen(false); 
                }
            };

            const handleLongRest = () => {
                setConfirmDialog({
                    title: "Take a Long Rest",
                    msg: "This will reset your HP to maximum, restore all spell slots, recover half your Hit Dice, and reduce Exhaustion by 1.",
                    actionText: "Rest",
                    onConfirm: () => {
                        const newHp = { ...char.hp, current: char.hp.max, temp: 0 };
                        const regain = Math.max(1, Math.floor(char.level / 2));
                        newHp.hitDiceCurrent = Math.min(char.level, newHp.hitDiceCurrent + regain);
                        
                        const newSlots = { ...char.spellSlots };
                        Object.keys(newSlots).forEach(k => newSlots[k].used = 0);
                        
                        const newDS = { successes: 0, failures: 0 };
                        const newExhaustion = Math.max(0, (char.exhaustion || 0) - 1);

                        setCharacters(prev => prev.map(c => c.id === activeId ? { ...c, hp: newHp, spellSlots: newSlots, deathSaves: newDS, exhaustion: newExhaustion } : c));
                        setRestModalOpen(false);
                        showToast("Long Rest Complete!");
                    }
                });
            };

            const setHitDieSize = (size) => updateHP('hitDieSize', size);

            const handleRollComplete = (result) => {
                if (result.label === "Short Rest (Hit Die)") {
                    const healed = result.total + result.mod;
                    const newHpCurrent = Math.min(char.hp.max, char.hp.current + healed);
                    const newHdCurrent = Math.max(0, char.hp.hitDiceCurrent - 1);
                    updateChar('hp', { ...char.hp, current: newHpCurrent, hitDiceCurrent: newHdCurrent });
                }
            };

            const exportData = (characterToExport = null) => {
                const data = characterToExport || characters;
                const fileName = characterToExport ? `${characterToExport.name.replace(/\s+/g, '_')}_sheet.json` : `akashic_roster_backup_${new Date().toISOString().slice(0,10)}.json`;
                const dataStr = JSON.stringify(data, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a'); link.href = url; link.download = fileName; document.body.appendChild(link); link.click(); document.body.removeChild(link);
                showToast("Export complete.");
            };

            const importData = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        const imported = Array.isArray(json) ? json : [json];
                        const valid = imported.filter(c => c.name && c.stats);
                        if (valid.length === 0) { showToast("Error: No valid character data found."); return; }
                        const newChars = valid.map(c => ({ ...c, id: `char-imp-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`, name: c.name + " (Imported)" }));
                        setCharacters(prev => [...prev, ...newChars]);
                        showToast(`Imported ${newChars.length} character(s).`);
                    } catch (err) { showToast("Error parsing JSON file."); }
                };
                reader.readAsText(file); e.target.value = null; 
            };

            const handleLootImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        const rawItems = Array.isArray(json) ? json : [json];
                        const flattenedItems = rawItems.flatMap(entry => entry.items ? entry.items : [entry]);
                        const newInventory = flattenedItems.map((item, index) => ({
                            id: `import-${Date.now()}-${index}`, name: item.name, qty: parseInt(item.qty) || 1,
                            notes: `${item.rarity ? `[${item.rarity.toUpperCase()}] ` : ''}${item.description || ''} ${item.val ? `(${item.val})` : ''}`
                        }));
                        updateChar('inventory', [...char.inventory, ...newInventory]);
                        showToast(`Imported ${newInventory.length} items.`);
                    } catch(err) { showToast("Failed to parse Loot JSON."); }
                };
                reader.readAsText(file); e.target.value = null;
            };

            const handleGenesisImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        let updates = { ...char };
                        let newFeatures = [...(char.features || [])];
                        let newAttacks = [...(char.attacks || [])];
                        const hasSubclass = json.subclasses && json.subclasses.length > 0;

                        const parseForAttack = (name, text, featureLevel) => {
                            if (!text) return;
                            const dmgRegex = /(\d+d\d+)(?:\s*\+\s*your\s+([a-zA-Z]+)\s+modifier)?\s+([a-zA-Z]+)\s+damage/i;
                            const match = text.match(dmgRegex);
                            if (match) {
                                const baseDmg = match[1]; const statStr = match[2]; const dmgType = match[3];
                                let bonusStr = "+0"; let finalDmg = baseDmg;
                                if (statStr) {
                                    const statShort = statStr.substring(0,3).toLowerCase();
                                    if (['str','dex','con','int','wis','cha'].includes(statShort)) {
                                        const mod = getMod(char.stats[statShort] || 10);
                                        const pb = getProficiency(char.level || 1);
                                        bonusStr = `+${mod + pb}`;
                                        finalDmg = `${baseDmg}${mod >= 0 ? '+'+mod : mod}`;
                                    }
                                }
                                newAttacks.push({
                                    id: `atk-gen-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                                    name: name, bonus: bonusStr, damage: finalDmg,
                                    type: dmgType.charAt(0).toUpperCase() + dmgType.slice(1), level: featureLevel
                                });
                            }
                        };

                        let importedSomething = false;

                        if (json.races && json.races.length > 0) {
                            importedSomething = true; const r = json.races[0]; updates.race = r.name;
                            if (r.speed) { const sm = r.speed.match(/(\d+)/); if (sm) updates.speed = parseInt(sm[1]); }
                            if (r.traits) r.traits.forEach(t => { newFeatures.push({ id: `feat-race-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`, name: t.name, source: r.name, desc: t.description, level: 1, featureType: 'race' }); parseForAttack(t.name, t.description, 1); });
                        }
                        
                        if (json.classes && json.classes.length > 0) {
                            importedSomething = true; const c = json.classes[0]; updates.class = c.name;
                            if (c.hitDie) { const hm = c.hitDie.match(/d(\d+)/i); if (hm) updates.hp = { ...updates.hp, hitDieSize: parseInt(hm[1]) }; }
                            if (c.features) c.features.forEach(f => {
                                if (hasSubclass) {
                                    const nl = f.name.toLowerCase();
                                    if (nl.includes('subclass') || nl.includes('archetype') || nl.includes('domain') || nl.includes('path') || nl.includes('tradition') || nl.includes('circle') || nl.includes('college')) return; 
                                }
                                newFeatures.push({ id: `feat-class-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`, name: f.name, source: c.name, desc: f.description, level: f.level, featureType: 'class' });
                                parseForAttack(f.name, f.description, f.level);
                            });
                        }

                        if (hasSubclass) {
                            importedSomething = true; const sc = json.subclasses[0];
                            updates.class = updates.class === sc.baseClass ? `${sc.baseClass} / ${sc.name}` : `${updates.class} / ${sc.name}`;
                            if (sc.features) sc.features.forEach(f => {
                                newFeatures.push({ id: `feat-subclass-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`, name: f.name, source: sc.name, desc: f.description, level: f.level, featureType: 'class' });
                                parseForAttack(f.name, f.description, f.level);
                            });
                        }

                        if (!importedSomething) { showToast("No Race, Class, or Subclass found in JSON."); return; }
                        updates.features = newFeatures; updates.attacks = newAttacks;
                        setCharacters(prev => prev.map(c => c.id === activeId ? updates : c));
                        showToast("Genesis data fully imported!");
                    } catch(err) { showToast("Failed to parse Genesis JSON."); }
                };
                reader.readAsText(file); e.target.value = null;
            };

            const pb = getProficiency(char.level);
            const spellMod = getMod(char.stats[char.spellAbility || 'int']);
            const spellAttack = spellMod + pb;
            const spellDC = 8 + spellMod + pb;

            const activeConditions = char.conditions || [];
            const exLevel = char.exhaustion || 0;
            const isImpaired = activeConditions.length > 0 || exLevel > 0;

            const raceFeatures = (char.features || []).filter(f => f.featureType === 'race' || f.source === char.race).filter(feat => !feat.level || feat.level <= char.level).sort((a,b) => (a.level||1) - (b.level||1));
