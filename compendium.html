<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Akashic Database | Central Compendium</title>
    
    <!-- PWA / Mobile App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Map for React modules -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react?deps=react@18.2.0"
        }
    }
    </script>

    <!-- Babel for JSX -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/core-js-bundle@3.37.1/minified.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <style>
        :root {
            --bg-deep: #020617; /* Slate 950 */
            --bg-panel: #0F172A; /* Slate 900 */
            --bg-card: #1E293B; /* Slate 800 */
            --accent-indigo: #6366f1;
            --accent-teal: #14b8a6;
            --accent-fuchsia: #d946ef;
            --accent-amber: #f59e0b;
        }

        body {
            background-color: var(--bg-deep);
            color: #F8FAFC;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* App handles its own scrolling */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #475569; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(51, 65, 85, 0.5);
        }

        .data-card {
            background: var(--bg-card);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        
        .data-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Markdown-style content rendering */
        .prose h1, .prose h2, .prose h3 { color: #F8FAFC; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
        .prose h1 { font-size: 1.5rem; border-bottom: 1px solid #334155; padding-bottom: 0.25em; }
        .prose h2 { font-size: 1.25rem; color: #cbd5e1; }
        .prose p { margin-bottom: 1em; line-height: 1.6; color: #94a3b8; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; color: #94a3b8; }
        .prose strong { color: #e2e8f0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            BookOpen, Search, Shield, Sword, Scroll, Ghost, 
            Settings, Menu, X, Database, Hexagon, Sparkles, UserCircle, LayoutGrid, Home
        } from 'lucide-react';

        // --- DEFAULT AKASHIC DATA (Legally distinct placeholders) ---
        // This serves as the empty template for the database. 
        // Other apps in the suite will append to these arrays in localStorage.
        const DEFAULT_DATABASE = {
            bestiary: [
                { id: 'b1', name: 'Astral Wisp', type: 'Elemental', CR: '1/4', tags: ['Tiny', 'Unaligned'], source: 'Akashic Defaults', content: '**Armor Class:** 13\n**Hit Points:** 7 (2d4 + 2)\n**Speed:** 0 ft., fly 40 ft. (hover)\n\n**STR** 2 (-4) | **DEX** 16 (+3) | **CON** 12 (+1) | **INT** 4 (-3) | **WIS** 10 (+0) | **CHA** 14 (+2)\n\n**Damage Resistances:** bludgeoning, piercing, and slashing from nonmagical attacks\n**Damage Immunities:** poison\n**Condition Immunities:** exhaustion, grappled, paralyzed, poisoned, prone, restrained, unconscious\n\n### Actions\n**Energy Flare.** *Melee or Ranged Spell Attack:* +4 to hit, reach 5 ft. or range 30 ft., one target. *Hit:* 4 (1d4 + 2) radiant damage.' }
            ],
            armory: [
                { id: 'i1', name: 'Akashic Core', type: 'Wondrous Item', rarity: 'Legendary', attunement: true, source: 'Akashic Defaults', content: 'A swirling mass of crystallized data from the Astral Plane.\n\nWhile attuned to this core, you gain a +2 bonus to spell attack rolls and your spell save DC. \n\n**Memory Recall:** Once per dawn, you can use an action to immediately recall any piece of lore, spell, or historical fact that has ever been recorded in the Akashic Records, effectively acting as the *Legend Lore* spell without material components.' }
            ],
            grimoire: [
                { id: 's1', name: 'Void Step', level: '2nd-level', school: 'Conjuration', castingTime: '1 Bonus Action', range: 'Self', duration: 'Instantaneous', source: 'Akashic Defaults', content: 'You briefly slip into the space between worlds, teleporting up to 30 feet to an unoccupied space that you can see. \n\nImmediately after you disappear, a faint echo of silence fills the space you left, granting you advantage on your next Dexterity (Stealth) check made before the end of your current turn.' }
            ],
            origins: [
                { id: 'o1', name: 'The Wayfarer', type: 'Class', source: 'Akashic Defaults', content: '### The Wayfarer\nWayfarers are travelers of the spaces between realities. They do not rely on brute strength or innate magical bloodlines, but rather their understanding of planar geometry and dimensional physics.\n\n**Hit Dice:** 1d8 per Wayfarer level\n**Armor Proficiencies:** Light armor\n**Weapon Proficiencies:** Simple weapons, shortswords\n\n#### Dimensional Strike (Level 1)\nYou learn to strike through tears in reality. When you make a melee weapon attack, you can increase your reach for that attack by 10 feet. You can use this feature a number of times equal to your proficiency bonus, regaining all expended uses on a short or long rest.' }
            ],
            codex: [
                { id: 'c1', name: 'The Rule of Cool', type: 'Mechanic', source: 'House Rules', content: 'If an action is exceptionally creative, dramatically appropriate, and mechanically plausible, the GM is encouraged to allow it, potentially granting Advantage or reducing the DC of the check. The narrative always serves the enjoyment of the table.' }
            ]
        };

        function App() {
            // State
            const [db, setDb] = useState(DEFAULT_DATABASE);
            const [activeTab, setActiveTab] = useState('bestiary');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [isAppSwitcherOpen, setIsAppSwitcherOpen] = useState(false);

            // Initialize Database from LocalStorage
            useEffect(() => {
                const loadData = () => {
                    try {
                        // Check for global Akashic Database
                        const storedDb = localStorage.getItem('akashic_database_v1');
                        if (storedDb) {
                            setDb(JSON.parse(storedDb));
                        } else {
                            // If none exists, set up the defaults
                            localStorage.setItem('akashic_database_v1', JSON.stringify(DEFAULT_DATABASE));
                        }
                    } catch (e) {
                        console.error("Failed to load database", e);
                    }
                };

                loadData();

                // Listen for changes from other tabs (e.g., Homebrew App saves a new monster)
                window.addEventListener('storage', (e) => {
                    if (e.key === 'akashic_database_v1') {
                        loadData();
                    }
                });

                return () => window.removeEventListener('storage', loadData);
            }, []);

            // Navigation configuration
            const navItems = [
                { id: 'bestiary', label: 'Bestiary', icon: Ghost, color: 'text-fuchsia-400', desc: 'Monsters & NPCs' },
                { id: 'armory', label: 'Armory', icon: Sword, color: 'text-amber-400', desc: 'Items & Artifacts' },
                { id: 'grimoire', label: 'Grimoire', icon: Sparkles, color: 'text-teal-400', desc: 'Spells & Magic' },
                { id: 'origins', label: 'Origins', icon: UserCircle, color: 'text-indigo-400', desc: 'Classes & Lineages' },
                { id: 'codex', label: 'Codex', icon: BookOpen, color: 'text-slate-300', desc: 'Rules & Lore' },
            ];

            const APP_LINKS = [
                { name: 'Database', url: 'compendium.html', icon: Database, color: 'text-indigo-400' },
                { name: 'Map', url: 'map.html', icon: Hexagon, color: 'text-cyan-400' },
                { name: 'Workshop', url: 'homebrew.html', icon: Ghost, color: 'text-fuchsia-400' },
                { name: 'Origins', url: 'origins.html', icon: UserCircle, color: 'text-blue-400' },
                { name: 'Tracker', url: 'tome.html', icon: Sword, color: 'text-red-400' },
                { name: 'Tokens', url: 'token.html', icon: Sparkles, color: 'text-amber-400' },
                { name: 'Loot', url: 'loot.html', icon: Scroll, color: 'text-amber-500' },
                { name: 'Sheet', url: 'sheet.html', icon: BookOpen, color: 'text-purple-400' },
                { name: 'Campaign', url: 'campaign.html', icon: Shield, color: 'text-emerald-400' }
            ];

            // Filter data based on search
            const currentData = useMemo(() => {
                const data = db[activeTab] || [];
                if (!searchQuery) return data;
                
                const lowerQuery = searchQuery.toLowerCase();
                return data.filter(item => 
                    item.name.toLowerCase().includes(lowerQuery) || 
                    (item.type && item.type.toLowerCase().includes(lowerQuery)) ||
                    (item.tags && item.tags.some(t => t.toLowerCase().includes(lowerQuery)))
                );
            }, [db, activeTab, searchQuery]);

            // Markdown parser (very basic implementation for safety and zero-dependencies)
            const renderMarkdown = (text) => {
                if (!text) return { __html: '' };
                
                // Extremely basic parsing for bold, italics, headers, lists
                let html = text
                    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                    .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/gim, '<em>$1</em>')
                    .replace(/\n/gim, '<br />');

                return { __html: html };
            };

            return (
                <div className="flex h-screen w-full bg-slate-950 text-slate-200">
                    
                    {/* MOBILE OVERLAY */}
                    {isMobileMenuOpen && (
                        <div 
                            className="fixed inset-0 bg-black/60 z-40 md:hidden backdrop-blur-sm"
                            onClick={() => setIsMobileMenuOpen(false)}
                        />
                    )}

                    {/* LEFT SIDEBAR NAVIGATION */}
                    <aside className={`
                        fixed md:static inset-y-0 left-0 z-50 w-64 glass-panel flex flex-col
                        transform transition-transform duration-300 ease-in-out
                        ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
                    `}>
                        {/* Branding */}
                        <div className="p-6 border-b border-slate-800/60 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-indigo-500/10 rounded-lg border border-indigo-500/30">
                                    <Database size={24} className="text-indigo-400" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight tracking-wide text-white">Akashic</h1>
                                    <p className="text-xs text-indigo-400 font-mono">DATABASE CORE</p>
                                </div>
                            </div>
                            <button className="md:hidden text-slate-400 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}>
                                <X size={20} />
                            </button>
                        </div>

                        {/* Navigation Links */}
                        <nav className="flex-1 overflow-y-auto py-4 custom-scrollbar">
                            <div className="px-3 space-y-1">
                                <p className="px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-2">Collections</p>
                                {navItems.map(item => {
                                    const Icon = item.icon;
                                    const isActive = activeTab === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => {
                                                setActiveTab(item.id);
                                                setSelectedItem(null);
                                                setIsMobileMenuOpen(false);
                                                setSearchQuery('');
                                            }}
                                            className={`
                                                w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 group text-left
                                                ${isActive ? 'bg-slate-800/80 shadow-inner border border-slate-700/50' : 'hover:bg-slate-800/40'}
                                            `}
                                        >
                                            <div className={`${isActive ? item.color : 'text-slate-500 group-hover:' + item.color} transition-colors`}>
                                                <Icon size={20} strokeWidth={isActive ? 2.5 : 2} />
                                            </div>
                                            <div>
                                                <div className={`font-medium ${isActive ? 'text-white' : 'text-slate-400 group-hover:text-slate-200'}`}>
                                                    {item.label}
                                                </div>
                                                <div className="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">
                                                    {db[item.id]?.length || 0} Entries
                                                </div>
                                            </div>
                                            
                                            {isActive && (
                                                <div className={`ml-auto w-1.5 h-6 rounded-full bg-current ${item.color} opacity-80`} />
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </nav>

                        {/* Footer Section */}
                        <div className="p-4 border-t border-slate-800/60 text-xs text-slate-500 font-mono text-center">
                            Local Storage System<br/>v2.0 Protected
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex flex-col min-w-0 relative">
                        
                        {/* Header Bar */}
                        <header className="h-20 border-b border-slate-800/60 flex items-center justify-between px-4 sm:px-8 bg-slate-950/50 backdrop-blur z-10">
                            <div className="flex items-center gap-4 flex-1">
                                <button 
                                    className="md:hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800"
                                    onClick={() => setIsMobileMenuOpen(true)}
                                >
                                    <Menu size={24} />
                                </button>
                                
                                <div className="hidden sm:block">
                                    <h2 className="text-xl font-bold text-white capitalize">{activeTab}</h2>
                                    <p className="text-xs text-slate-400">{navItems.find(i => i.id === activeTab)?.desc}</p>
                                </div>

                                {/* Search Bar */}
                                <div className="flex-1 max-w-md ml-auto relative">
                                    <Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                                    <input 
                                        type="text" 
                                        placeholder={`Search ${activeTab}...`}
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 text-white rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-shadow"
                                    />
                                </div>

                                {/* Global App Controls */}
                                <div className="flex items-center gap-2 ml-2 sm:ml-4 flex-shrink-0">
                                    {/* Home Button */}
                                    <a 
                                        href="index.html"
                                        className="p-2.5 bg-slate-900 border border-slate-700 hover:border-indigo-500 text-slate-400 hover:text-white rounded-xl transition-all shadow-sm flex items-center justify-center"
                                        title="Return to Hub"
                                    >
                                        <Home size={20} />
                                    </a>

                                    {/* App Switcher Dropdown */}
                                    <div className="relative">
                                        <button 
                                            onClick={() => setIsAppSwitcherOpen(!isAppSwitcherOpen)}
                                            className="p-2.5 bg-slate-900 border border-slate-700 hover:border-indigo-500 text-slate-400 hover:text-white rounded-xl transition-all shadow-sm flex items-center justify-center"
                                            title="Akashic Suite Navigation"
                                        >
                                            <LayoutGrid size={20} />
                                        </button>

                                        {isAppSwitcherOpen && (
                                            <>
                                                <div className="fixed inset-0 z-40" onClick={() => setIsAppSwitcherOpen(false)}></div>
                                                <div className="absolute right-0 mt-3 w-72 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-2xl shadow-2xl z-50 overflow-hidden">
                                                    <div className="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                                                        <h3 className="font-bold text-white flex items-center gap-2 text-sm">
                                                            <LayoutGrid size={16} className="text-indigo-400"/>
                                                            Akashic Suite
                                                        </h3>
                                                    </div>
                                                    <div className="p-4 grid grid-cols-3 gap-3">
                                                        {APP_LINKS.filter(app => app.url !== 'compendium.html').map(app => (
                                                            <a 
                                                                key={app.name} 
                                                                href={app.url}
                                                                className="flex flex-col items-center gap-2 p-2 rounded-xl hover:bg-slate-800 transition-colors group text-center"
                                                            >
                                                                <div className={`p-2.5 bg-slate-950 rounded-xl border border-slate-800 group-hover:border-slate-600 shadow-inner ${app.color}`}>
                                                                    <app.icon size={20} strokeWidth={2} />
                                                                </div>
                                                                <span className="text-[10px] font-medium text-slate-400 group-hover:text-white tracking-wide">{app.name}</span>
                                                            </a>
                                                        ))}
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>

                            </div>
                        </header>

                        {/* Data Grid */}
                        <div className="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar">
                            {currentData.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-500 space-y-4">
                                    <Hexagon size={48} className="text-slate-700" strokeWidth={1} />
                                    <p className="text-lg">No entries found in this collection.</p>
                                    <p className="text-sm">Use the suite tools to populate the database.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                    {currentData.map(item => (
                                        <div 
                                            key={item.id} 
                                            onClick={() => setSelectedItem(item)}
                                            className="data-card p-4 rounded-xl cursor-pointer flex flex-col group"
                                        >
                                            <div className="flex justify-between items-start mb-3">
                                                <h3 className="font-bold text-slate-100 group-hover:text-white truncate pr-2" title={item.name}>{item.name}</h3>
                                                <div className="bg-slate-900 rounded p-1.5 border border-slate-700/50">
                                                    {React.createElement(navItems.find(i => i.id === activeTab)?.icon || Hexagon, { size: 16, className: 'text-slate-400' })}
                                                </div>
                                            </div>
                                            
                                            {/* Dynamic Sub-info based on type */}
                                            <div className="mt-auto space-y-2">
                                                {(item.type || item.school || item.level) && (
                                                    <div className="flex gap-2 text-xs font-mono text-slate-400">
                                                        {item.level && <span>{item.level}</span>}
                                                        {item.school && <span>{item.school}</span>}
                                                        {item.type && !item.school && <span>{item.type}</span>}
                                                    </div>
                                                )}
                                                
                                                <div className="flex items-center justify-between mt-2 pt-3 border-t border-slate-700/50">
                                                    <span className="text-[10px] text-slate-500 uppercase tracking-wider">{item.source || 'Custom'}</span>
                                                    {item.CR && <span className="text-xs font-bold text-fuchsia-400 bg-fuchsia-400/10 px-2 py-0.5 rounded">CR {item.CR}</span>}
                                                    {item.rarity && <span className="text-xs font-bold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded">{item.rarity}</span>}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* DETAIL MODAL OVERLAY */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 sm:p-6 md:p-12">
                            {/* Backdrop */}
                            <div 
                                className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"
                                onClick={() => setSelectedItem(null)}
                            ></div>
                            
                            {/* Modal Content */}
                            <div className="relative w-full max-w-4xl max-h-full bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                                
                                {/* Modal Header */}
                                <div className="flex items-center justify-between p-6 border-b border-slate-800 bg-slate-900/50">
                                    <div>
                                        <h2 className="text-2xl font-bold text-white">{selectedItem.name}</h2>
                                        <p className="text-sm text-slate-400 font-mono mt-1">
                                            {[selectedItem.type, selectedItem.level, selectedItem.school, selectedItem.rarity].filter(Boolean).join(' • ')}
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedItem(null)}
                                        className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-full transition-colors"
                                    >
                                        <X size={24} />
                                    </button>
                                </div>

                                {/* Modal Body (Scrollable Markdown Content) */}
                                <div className="flex-1 overflow-y-auto p-6 md:p-10 custom-scrollbar bg-[#0a0f1c]">
                                    
                                    {/* Tag Bar */}
                                    {selectedItem.tags && selectedItem.tags.length > 0 && (
                                        <div className="flex flex-wrap gap-2 mb-6">
                                            {selectedItem.tags.map(tag => (
                                                <span key={tag} className="px-3 py-1 bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-full">
                                                    {tag}
                                                </span>
                                            ))}
                                        </div>
                                    )}

                                    {/* Markdown Content rendered safely */}
                                    <div 
                                        className="prose prose-invert max-w-none"
                                        dangerouslySetInnerHTML={renderMarkdown(selectedItem.content)}
                                    />
                                    
                                    {!selectedItem.content && (
                                        <div className="text-slate-500 italic text-center py-10">
                                            No detailed content provided for this entry.
                                        </div>
                                    )}
                                </div>
                                
                                {/* Modal Footer */}
                                <div className="p-4 border-t border-slate-800 bg-slate-900 flex justify-between items-center text-xs text-slate-500 font-mono">
                                    <span>ID: {selectedItem.id}</span>
                                    <span>Source: {selectedItem.source || 'Akashic Custom'}</span>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
