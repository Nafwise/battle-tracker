<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akashic Arsenal | Modular Weapon Forge</title>
    
    <!-- PWA / Mobile App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0F172A">

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Polyfills & Babel -->
    <script src="https://cdn.jsdelivr.net/npm/core-js-bundle@3.37.1/minified.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* --- The Astral Plane Palette (Forge Theme) --- */
        :root {
            --astral-bg: #0F172A;       
            --astral-card: #1E293B;     
            --astral-input: #020617;    
            --text-primary: #F8FAFC;    
            --accent-forge: #f97316;    
            --accent-glow: rgba(249, 115, 22, 0.4);
            
            /* Tier Colors */
            --tier-0: #94a3b8; /* Standard */
            --tier-1: #38bdf8; /* Tempered */
            --tier-2: #a855f7; /* Awakened */
            --tier-3: #fbbf24; /* Exalted */
            --tier-red: #ef4444; /* Regression */
        }

        body {
            background-color: var(--astral-bg);
            color: var(--text-primary);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1e1b4b, #0F172A);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--astral-bg); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-forge); }

        .input-base {
            background-color: var(--astral-input);
            border: 1px solid #334155;
            color: var(--text-primary);
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            transition: all 0.2s;
        }
        .input-base:focus {
            outline: none;
            border-color: var(--accent-forge);
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
        }

        .card-panel {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 0.5rem;
            backdrop-filter: blur(8px);
        }

        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover {
            border-color: var(--accent-forge);
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .toast-enter { animation: slideIn 0.3s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .modal-enter { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const IconSword = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 14.5L18 11"/></svg>;
        const IconSettings = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconPlus = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconChevronLeft = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>;
        const IconTrash = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconSave = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconSparkles = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.1 2.9c.2.2.2.5 0 .7l-3.3 3.3a3.5 3.5 0 0 0-.8 1.4l-1 3.5c-.1.3-.5.3-.6 0l-1-3.5a3.5 3.5 0 0 0-.8-1.4l-3.3-3.3c-.2-.2-.2-.5 0-.7l3.3-3.3a3.5 3.5 0 0 0 .8-1.4l1-3.5c.1-.3.5-.3.6 0l1 3.5a3.5 3.5 0 0 0 .8 1.4l3.3 3.3z"/><path d="M10 16.5l-2.5 2.5a1.5 1.5 0 0 1-2.1-2.1l2.5-2.5"/><path d="M14 20l-1.5-1.5"/><path d="M4 10l1.5 1.5"/></svg>;
        const IconAlert = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
        const IconBox = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
        const IconDownload = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconLibrary = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;
        const IconWrench = ({ size=24, className="" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.77 3.77z"/></svg>;

        // --- Lore & Manufacturer Data ---
        const MANUFACTURER_DATA = [
            { id: "mycen", name: "Mycen", type: "Purifier", trait: "Decay (Max damage rolls cause rotting acid damage)", integration: "Fungal Cultivation (Crushed into fertilizer to grow elemental mushrooms)" },
            { id: "vitala", name: "Vitala", type: "Pulse/Triage", trait: "Triage (+1 to non-lethal attacks)", integration: "Immersion Chamber (Dissolved into fluid to buff/heal allies)" },
            { id: "bastion-radiant", name: "Bastion Upper Caste", type: "Radiant", trait: "Illumination (Emits 20ft light, damages undead/glitch)", integration: "The Anointing (Placed in a reliquary, converts dark magic to holy/radiant)" },
            { id: "bastion-siege", name: "Bastion Militia", type: "Siege", trait: "Phalanx (+1 AC when near ally/cover)", integration: "Granite Fusion (Melted into the iron, grants elemental resistance)" },
            { id: "lunaris", name: "Lunaris", type: "Void-Field", trait: "Weightless (Removes Heavy property, doubles thrown range)", integration: "Orbital Chamber (Orbits the gun in a mini gravity field)" },
            { id: "lycarus", name: "Lycarus", type: "Beast-Hunter", trait: "Momentum (+2 damage after moving 15ft straight)", integration: "Twin Sockets (Holds two gems for synergistic dual-strikes)" },
            { id: "oculon", name: "Oculon", type: "Hard-Tech", trait: "Calibrated (Never misfires, Free Action to draw/stow)", integration: "Arcane Socketing (Mechanically slotted via locking key)" },
            { id: "corali", name: "Corali", type: "Bio-Arsenal", trait: "Amphibious (Functions perfectly underwater)", integration: "Bio-Absorption (Digested by the living weapon over 1 minute)" },
            { id: "kirathi", name: "Kirathi", type: "Gale-Arsenal", trait: "Dive-Strike (Push targets 5ft if attacking after moving downward)", integration: "Resonance Chamber (Wind whistles over gem, applying atmospheric debuffs)" },
            { id: "sylvid", name: "Sylvid", type: "Archive-Arsenal", trait: "Telemetry (Pings AC/conditions on first hit, +1 to hit thereafter)", integration: "Amber Encodement (Petrified in amber, grants a passive Skill Proficiency)" },
            { id: "custom", name: "Custom Chassis", type: "Unknown", trait: "None (Standard 1d6 Bludgeoning)", integration: "Manual Integration" }
        ];

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const getEmptyWeapon = (mId = "bastion-siege") => {
            const mData = MANUFACTURER_DATA.find(m => m.id === mId) || MANUFACTURER_DATA[0];
            return {
                id: generateId(),
                name: "Unforged Chassis",
                manufacturerId: mData.id,
                exp: 0,
                slots: {
                    form: { name: "", type: "", damage: "", description: "" },
                    grip: { name: "", type: "", description: "" },
                    optic: { name: "", type: "", description: "" },
                    mag: { name: "", type: "", description: "" },
                    gem: { name: "", type: "", description: "", mechanic: mData.integration }
                },
                godSpark: { active: false, name: "", description: "" },
                notes: ""
            };
        };

        const getEmptyAttachment = (category = 'form') => {
            return {
                id: generateId(),
                category: category, 
                name: "",
                type: "",
                damage: "", 
                mechanic: "",
                description: ""
            };
        };

        const getTierInfo = (exp) => {
            if (exp < 0) return { name: "Red Code (Regression)", color: "var(--tier-red)", bonus: "Negative" };
            if (exp < 150) return { name: "Standard", color: "var(--tier-0)", bonus: "+0" };
            if (exp < 300) return { name: "Tempered", color: "var(--tier-1)", bonus: "+1" };
            if (exp < 600) return { name: "Awakened", color: "var(--tier-2)", bonus: "+2" };
            return { name: "Exalted", color: "var(--tier-3)", bonus: "+3" };
        };

        const exportToJson = (weapon) => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(weapon, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `${weapon.name.replace(/\s+/g, '_')}_Aethelgard.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        // --- Main Application ---
        function App() {
            const [weapons, setWeapons] = useState([]);
            const [attachments, setAttachments] = useState([]);
            const [view, setView] = useState('weapons'); // 'weapons' | 'weapon-editor' | 'attachments' | 'attachment-editor'
            const [currentWeapon, setCurrentWeapon] = useState(null);
            const [currentAttachment, setCurrentAttachment] = useState(null);
            const [attachmentFilter, setAttachmentFilter] = useState('all');
            
            const [showSettings, setShowSettings] = useState(false);
            const [apiKey, setApiKey] = useState("");
            const [aiModel, setAiModel] = useState("gemini-2.5-flash-preview-09-2025");
            
            const [showAiModal, setShowAiModal] = useState(false);
            const [showOutfitModal, setShowOutfitModal] = useState(false);
            const [showSelectorModal, setShowSelectorModal] = useState({ open: false, slotKey: null });
            
            const [aiPrompt, setAiPrompt] = useState("");
            const [aiTargetSlot, setAiTargetSlot] = useState("all");
            const [isGenerating, setIsGenerating] = useState(false);

            const [toast, setToast] = useState(null);

            useEffect(() => {
                const storedWeapons = localStorage.getItem('akashic_armory_weapons');
                if (storedWeapons) setWeapons(JSON.parse(storedWeapons));
                
                const storedAttachments = localStorage.getItem('akashic_armory_attachments');
                if (storedAttachments) setAttachments(JSON.parse(storedAttachments));

                const storedKey = localStorage.getItem('akashic_gemini_key');
                if (storedKey) setApiKey(storedKey);
                
                const storedModel = localStorage.getItem('akashic_gemini_model');
                if (storedModel) setAiModel(storedModel);
            }, []);

            useEffect(() => {
                localStorage.setItem('akashic_armory_weapons', JSON.stringify(weapons));
            }, [weapons]);

            useEffect(() => {
                localStorage.setItem('akashic_armory_attachments', JSON.stringify(attachments));
            }, [attachments]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            // --- Weapon Logic ---
            const startForgeWeapon = () => {
                const nw = getEmptyWeapon();
                setCurrentWeapon(nw);
                setShowOutfitModal(true);
            };

            const confirmOutfitting = (mId) => {
                const mData = MANUFACTURER_DATA.find(m => m.id === mId);
                setCurrentWeapon(prev => ({
                    ...prev,
                    manufacturerId: mId,
                    slots: {
                        ...prev.slots,
                        gem: { ...prev.slots.gem, mechanic: mData.integration }
                    }
                }));
                setShowOutfitModal(false);
                setView('weapon-editor');
            };

            const editWeapon = (wpn) => {
                setCurrentWeapon({...wpn});
                setView('weapon-editor');
            };

            const saveCurrentWeapon = () => {
                setWeapons(prev => {
                    const exists = prev.find(w => w.id === currentWeapon.id);
                    if (exists) return prev.map(w => w.id === currentWeapon.id ? currentWeapon : w);
                    return [...prev, currentWeapon];
                });
                setView('weapons');
                showToast("Weapon saved to Arsenal.", "success");
            };

            const deleteWeapon = (id) => {
                if(confirm("Permanently destroy this weapon?")) {
                    setWeapons(prev => prev.filter(w => w.id !== id));
                }
            };

            // --- Attachment Logic ---
            const startForgeAttachment = () => {
                setCurrentAttachment(getEmptyAttachment('form'));
                setView('attachment-editor');
            };

            const editAttachment = (att) => {
                setCurrentAttachment({...att});
                setView('attachment-editor');
            };

            const saveCurrentAttachment = () => {
                if(!currentAttachment.name) {
                    showToast("Attachment must have a name.", "error");
                    return;
                }
                setAttachments(prev => {
                    const exists = prev.find(a => a.id === currentAttachment.id);
                    if (exists) return prev.map(a => a.id === currentAttachment.id ? currentAttachment : a);
                    return [...prev, currentAttachment];
                });
                setView('attachments');
                showToast("Attachment saved to Library.", "success");
            };

            const deleteAttachment = (id) => {
                if(confirm("Scrap this attachment from the Library?")) {
                    setAttachments(prev => prev.filter(a => a.id !== id));
                }
            };

            const equipToWeapon = (att) => {
                const targetSlot = showSelectorModal.slotKey;
                if(targetSlot === 'godspark') {
                    setCurrentWeapon(prev => ({
                        ...prev,
                        godSpark: { active: true, name: att.name, description: att.description }
                    }));
                } else {
                    setCurrentWeapon(prev => ({
                        ...prev,
                        slots: {
                            ...prev.slots,
                            [targetSlot]: {
                                name: att.name,
                                type: att.type,
                                damage: att.damage,
                                mechanic: att.mechanic,
                                description: att.description
                            }
                        }
                    }));
                }
                setShowSelectorModal({ open: false, slotKey: null });
                showToast(`${att.name} equipped.`, "success");
            };

            // --- AI Logic ---
            const generateWithAI = async () => {
                if (!apiKey) {
                    showToast("API Key required. Please check settings.", "error");
                    setShowSettings(true);
                    return;
                }
                setIsGenerating(true);

                let systemPrompt = "";

                if (view === 'attachment-editor') {
                    systemPrompt = `You are a legendary weapon smith in Aethelgard. You build modular weapon attachments.
                    The user wants to forge a single attachment for the category: ${currentAttachment.category.toUpperCase()}.
                    Ensure the mechanics match the D&D 5e system and the lore of Aethelgard.
                    Always respond in valid JSON matching this schema exactly:
                    {
                        "name": "Creative Attachment Name",
                        "type": "e.g. Melee Grip, Utility Sight, Extended Mag, Element Type",
                        "damage": "e.g. 1d8 Slashing (ONLY provide if category is 'form', else empty string)",
                        "mechanic": "Specific integration rule (ONLY provide if category is 'gem', else empty string)",
                        "description": "Combat mechanics and lore description."
                    }`;
                } else if (view === 'weapon-editor') {
                    const mData = MANUFACTURER_DATA.find(m => m.id === currentWeapon.manufacturerId) || MANUFACTURER_DATA[0];
                    systemPrompt = `You are a legendary weapon smith in Aethelgard. You build modular weapons.
                    CRITICAL INSTRUCTION: The user is auto-assembling a full weapon for the following manufacturer:
                    - Manufacturer: ${mData.name}
                    - Type: ${mData.type}
                    - Base Trait: ${mData.trait}
                    - Gemstone Integration: ${mData.integration}
                    
                    You MUST tailor the weapon's flavor, descriptions, and mechanics perfectly to this manufacturer. 
                    Always respond in valid JSON matching this schema exactly:
                    {
                        "name": "Weapon Name",
                        "slots": {
                            "form": { "name": "Attachment Name", "type": "e.g. Melee, Ranged", "damage": "e.g. 1d8 Slashing", "description": "Mechanics..." },
                            "grip": { "name": "Attachment Name", "type": "e.g. Melee Grip", "description": "Mechanics..." },
                            "optic": { "name": "Attachment Name", "type": "e.g. Standard Sight", "description": "Mechanics..." },
                            "mag": { "name": "Attachment Name", "type": "e.g. Standard Mag", "description": "Mechanics..." },
                            "gem": { "name": "Gem Type (e.g. Ruby)", "type": "Element", "description": "Mechanics...", "mechanic": "${mData.integration}" }
                        },
                        "godSpark": { "active": false, "name": "", "description": "" }
                    }`;
                }

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${aiModel}:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: `User Request: ${aiPrompt}` }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                try {
                    const data = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (responseText) {
                        const parsed = JSON.parse(responseText);
                        
                        if (view === 'attachment-editor') {
                            setCurrentAttachment(prev => ({
                                ...prev,
                                name: parsed.name || prev.name,
                                type: parsed.type || prev.type,
                                damage: parsed.damage || prev.damage,
                                mechanic: parsed.mechanic || prev.mechanic,
                                description: parsed.description || prev.description
                            }));
                        } else if (view === 'weapon-editor') {
                            setCurrentWeapon(prev => ({
                                ...prev,
                                name: parsed.name || prev.name,
                                slots: parsed.slots,
                                godSpark: parsed.godSpark || {active: false, name:"", description:""}
                            }));
                        }
                        
                        showToast("Generation successful!", "success");
                        setShowAiModal(false);
                        setAiPrompt("");
                    } else { throw new Error("Invalid response"); }
                } catch (error) {
                    showToast("Failed to forge. Check API key.", "error");
                } finally {
                    setIsGenerating(false);
                }
            };

            // --- Sub-Renders ---
            
            const TopNavigation = () => (
                <div className="flex flex-col sm:flex-row justify-between items-center mb-8 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 backdrop-blur-md gap-4">
                    <div className="flex items-center gap-3 w-full sm:w-auto">
                        <div className="w-10 h-10 rounded bg-orange-600 flex shrink-0 items-center justify-center text-white shadow-lg shadow-orange-600/30">
                            <IconSword size={24} />
                        </div>
                        <h1 className="text-xl sm:text-2xl font-black tracking-widest text-white truncate">AETHELGARD ARMORY</h1>
                    </div>
                    <div className="flex gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                        <button onClick={() => setView('weapons')} className={`px-4 py-2 rounded font-bold text-sm transition whitespace-nowrap ${view === 'weapons' || view === 'weapon-editor' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/30' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}`}>
                            <IconBox size={16} className="inline mr-2" /> Arsenal
                        </button>
                        <button onClick={() => setView('attachments')} className={`px-4 py-2 rounded font-bold text-sm transition whitespace-nowrap ${view === 'attachments' || view === 'attachment-editor' ? 'bg-teal-600 text-white shadow-lg shadow-teal-900/30' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}`}>
                            <IconLibrary size={16} className="inline mr-2" /> Attachment Library
                        </button>
                        <button onClick={() => setShowSettings(true)} className="p-2 text-slate-400 hover:text-white transition bg-slate-800 rounded border border-slate-700 shrink-0">
                            <IconSettings size={20} />
                        </button>
                    </div>
                </div>
            );

            const renderWeaponsList = () => (
                <div className="animate-fade-in">
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h2 className="text-3xl font-black text-white tracking-wider flex items-center gap-3">
                                THE ARSENAL
                            </h2>
                            <p className="text-slate-400 mt-1 italic">Assembled Modular Weaponry</p>
                        </div>
                        <button onClick={startForgeWeapon} className="bg-orange-600 hover:bg-orange-500 text-white px-5 py-3 rounded-lg font-bold shadow-lg shadow-orange-900/30 transition flex items-center gap-2">
                            <IconPlus size={20} /> Assemble Weapon
                        </button>
                    </div>

                    {weapons.length === 0 ? (
                        <div className="text-center py-20 card-panel border-dashed border-slate-600">
                            <IconSword className="mx-auto text-slate-500 mb-4" size={48} />
                            <h3 className="text-xl text-slate-300 font-bold mb-2">The Racks Are Empty</h3>
                            <p className="text-slate-500 mb-6">No weapons have been assembled yet.</p>
                            <button onClick={startForgeWeapon} className="text-orange-400 hover:text-orange-300 font-bold underline">Begin Assembly</button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {weapons.map(w => {
                                const tier = getTierInfo(w.exp || 0);
                                const mData = MANUFACTURER_DATA.find(m => m.id === w.manufacturerId) || MANUFACTURER_DATA[0];
                                return (
                                    <div key={w.id} className="card-panel card-hover p-5 relative overflow-hidden group">
                                        <div className="absolute top-0 left-0 w-full h-1" style={{backgroundColor: tier.color}}></div>
                                        <div className="flex justify-between items-start mb-4 mt-2">
                                            <div>
                                                <h3 className="text-xl font-bold text-white mb-1">{w.name}</h3>
                                                <p className="text-xs font-mono text-slate-400">{mData.name} ({mData.type})</p>
                                            </div>
                                            <div className="text-right flex flex-col gap-2 items-end">
                                                <span className="inline-block px-2 py-1 rounded text-xs font-bold bg-slate-800 border border-slate-600" style={{color: tier.color}}>
                                                    {tier.name} ({tier.bonus})
                                                </span>
                                            </div>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded border border-slate-700/50 mb-4 min-h-[60px]">
                                            <p className="text-sm text-slate-300">
                                                <span className="text-orange-400 font-bold">DMG:</span> {w.slots?.form?.damage || "1d6 Bludgeoning (Bare)"}
                                            </p>
                                            <p className="text-sm text-slate-300 truncate mt-1">
                                                <span className="text-teal-400 font-bold">Gem:</span> {w.slots?.gem?.name || "None"}
                                            </p>
                                        </div>
                                        <div className="flex justify-between items-center mt-4">
                                            <button onClick={() => exportToJson(w)} className="text-slate-400 hover:text-teal-400 transition-colors flex items-center gap-1 text-xs font-bold" title="Export JSON">
                                                <IconDownload size={16} /> Export
                                            </button>
                                            <div className="flex gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => deleteWeapon(w.id)} className="p-2 text-slate-400 hover:text-red-500 transition-colors" title="Scrap Weapon">
                                                    <IconTrash size={18} />
                                                </button>
                                                <button onClick={() => editWeapon(w)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold rounded transition-colors">
                                                    Inspect
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );

            const renderWeaponEditor = () => {
                if(!currentWeapon) return null;
                const tier = getTierInfo(currentWeapon.exp);
                const isRedCode = currentWeapon.exp < 0;
                const currentMData = MANUFACTURER_DATA.find(m => m.id === currentWeapon.manufacturerId) || MANUFACTURER_DATA[0];

                const SlotBox = ({ title, slotKey, isGodSpark = false }) => {
                    const slotData = isGodSpark ? currentWeapon.godSpark : currentWeapon.slots[slotKey];
                    const isEmpty = isGodSpark ? !slotData.active : (!slotData.name || slotData.name === "");

                    return (
                        <div className="card-panel p-5 relative border border-slate-700 bg-slate-800/40">
                            {isGodSpark && slotData.active && (
                                <div className="absolute -top-3 -right-3 bg-red-600 text-white text-[10px] font-black px-3 py-1 uppercase tracking-widest transform rotate-12 shadow-lg border border-red-400 z-10">Anomaly Detected</div>
                            )}
                            <div className="flex justify-between items-center mb-4">
                                <h4 className={`font-bold uppercase tracking-wider text-sm ${isGodSpark ? 'text-red-400' : 'text-orange-400'}`}>{title}</h4>
                            </div>

                            {isEmpty ? (
                                <div className="text-center py-6 border-2 border-dashed border-slate-600 rounded-lg bg-slate-900/50 hover:border-orange-500 hover:bg-slate-800 transition group cursor-pointer" onClick={() => setShowSelectorModal({open: true, slotKey})}>
                                    <p className="text-slate-500 mb-3 text-sm group-hover:text-slate-300">Slot Empty</p>
                                    <button className="bg-slate-700 group-hover:bg-orange-600 text-white px-4 py-2 rounded text-sm font-bold transition flex items-center gap-2 mx-auto">
                                        <IconLibrary size={16}/> Equip from Library
                                    </button>
                                </div>
                            ) : (
                                <div className={`bg-slate-900 border p-4 rounded-lg relative ${isGodSpark ? 'border-red-900/50 shadow-[inset_0_0_15px_rgba(220,38,38,0.1)]' : 'border-slate-700 shadow-inner'}`}>
                                    <div className="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                        <div>
                                            <h5 className="font-bold text-white text-lg leading-tight">{slotData.name}</h5>
                                            {!isGodSpark && <span className="text-xs font-mono text-slate-400">{slotData.type}</span>}
                                        </div>
                                        <div className="flex gap-2 shrink-0 ml-2">
                                            <button onClick={() => setShowSelectorModal({open: true, slotKey})} className="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white transition">Swap</button>
                                            <button onClick={() => {
                                                if(isGodSpark) setCurrentWeapon(prev => ({...prev, godSpark: {active: false, name: "", description: ""}}));
                                                else updateSlot(slotKey, 'name', "");
                                            }} className="text-xs bg-red-900/50 hover:bg-red-800 text-red-300 px-2 py-1 rounded transition">Unequip</button>
                                        </div>
                                    </div>
                                    {slotData.damage && !isGodSpark && <p className="text-sm text-red-400 font-mono mb-2 bg-red-950/30 inline-block px-2 py-1 rounded border border-red-900/50">{slotData.damage}</p>}
                                    {slotKey === 'gem' && !isGodSpark && <p className="text-xs text-emerald-400 mb-3 p-2 bg-emerald-950/30 rounded border border-emerald-900/50"><strong>Integration Rule:</strong><br/>{slotData.mechanic}</p>}
                                    <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">{slotData.description}</p>
                                </div>
                            )}
                        </div>
                    );
                };

                return (
                    <div className="animate-fade-in pb-24">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b border-slate-700 pb-4">
                            <button onClick={() => setView('weapons')} className="text-slate-400 hover:text-white flex items-center gap-1 transition font-bold">
                                <IconChevronLeft size={20} /> Back to Arsenal
                            </button>
                            <div className="flex gap-3 flex-wrap">
                                <button onClick={() => exportToJson(currentWeapon)} className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded font-bold shadow transition flex items-center gap-2 text-sm">
                                    <IconDownload size={16} /> Export
                                </button>
                                <button onClick={() => { setAiTargetSlot('all'); setShowAiModal(true); }} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded font-bold shadow transition flex items-center gap-2 text-sm">
                                    <IconSparkles size={16} /> Auto-Assemble (AI)
                                </button>
                                <button onClick={saveCurrentWeapon} className="bg-orange-600 hover:bg-orange-500 text-white px-6 py-2 rounded font-bold shadow-lg shadow-orange-900/30 transition flex items-center gap-2">
                                    <IconSave size={18} /> Save Weapon
                                </button>
                            </div>
                        </div>

                        {/* Header Stats */}
                        <div className={`card-panel p-6 mb-6 border-t-4 ${isRedCode ? 'border-red-500' : 'border-orange-500'}`}>
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 space-y-4">
                                    <div>
                                        <label className="block text-sm text-slate-400 mb-1 font-bold">Weapon Designation</label>
                                        <input type="text" className="input-base text-2xl font-black text-white h-14" value={currentWeapon.name} onChange={(e) => setCurrentWeapon({...currentWeapon, name: e.target.value})} placeholder="Weapon Name" />
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-lg border border-slate-700">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <label className="block text-sm text-slate-400 mb-1 font-bold">Active Chassis</label>
                                                <p className="text-lg text-white font-bold">{currentMData.name} <span className="text-sm font-mono text-slate-500 bg-slate-800 px-2 py-0.5 rounded ml-2">{currentMData.type}</span></p>
                                            </div>
                                            <button onClick={() => setShowOutfitModal(true)} className="text-xs bg-slate-800 hover:bg-slate-700 text-orange-400 px-3 py-2 rounded font-bold border border-slate-600 transition">Change Chassis</button>
                                        </div>
                                        <div className="mt-3 p-3 bg-emerald-950/20 border border-emerald-900/30 rounded">
                                            <p className="text-sm text-emerald-400"><strong>Base Trait:</strong> {currentMData.trait}</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className={`p-4 rounded-lg border ${isRedCode ? 'bg-red-950/30 border-red-900/50' : 'bg-slate-900/50 border-slate-700/50'} flex flex-col justify-center`}>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-sm font-bold text-slate-400">Animus Ledger (EXP)</span>
                                        <span className="text-xs font-mono text-slate-500">10 EXP = 1 CR</span>
                                    </div>
                                    <input type="number" className="input-base text-xl font-mono text-center mb-3" value={currentWeapon.exp} onChange={(e) => setCurrentWeapon({...currentWeapon, exp: parseInt(e.target.value) || 0})} />
                                    <div className="text-center p-2 rounded bg-slate-950 border border-slate-800">
                                        <span className="block text-sm font-bold" style={{color: tier.color}}>
                                            {isRedCode ? <span className="flex items-center justify-center gap-1"><IconAlert size={14}/> RED CODE</span> : tier.name}
                                        </span>
                                        <span className="text-xs text-slate-400">Current Modifier: {tier.bonus}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Equipment Slots */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <SlotBox title="1. Form Slot (Blade/Barrel)" slotKey="form" />
                            <SlotBox title="2. Grip Slot (Handling/Stock)" slotKey="grip" />
                            <SlotBox title="3. Optic Slot (Sights)" slotKey="optic" />
                            <SlotBox title="4. Mag Slot (Ammunition/Core)" slotKey="mag" />
                        </div>
                        <div className="mb-6"><SlotBox title="5. Gemstone Integration" slotKey="gem" /></div>

                        {/* God Spark */}
                        <div className={`card-panel p-6 border-2 transition-colors ${currentWeapon.godSpark.active ? 'border-red-600 shadow-[0_0_15px_rgba(220,38,38,0.3)]' : 'border-dashed border-slate-600'}`}>
                            <div className="flex items-center gap-3 mb-4">
                                <input type="checkbox" id="godspark-toggle" className="w-5 h-5 accent-red-600" checked={currentWeapon.godSpark.active} onChange={(e) => setCurrentWeapon({...currentWeapon, godSpark: {...currentWeapon.godSpark, active: e.target.checked}})} />
                                <label htmlFor="godspark-toggle" className="text-xl font-black tracking-widest uppercase flex items-center gap-2 cursor-pointer select-none">
                                    <span className={currentWeapon.godSpark.active ? 'text-red-500' : 'text-slate-500'}>Anomalous Attachment (God-Spark)</span>
                                    {currentWeapon.godSpark.active && <IconAlert className="text-red-500" size={24} />}
                                </label>
                            </div>
                            {currentWeapon.godSpark.active && (<div className="mt-4 animate-fade-in"><SlotBox title="Warning: Reality Manipulation" slotKey="godspark" isGodSpark={true} /></div>)}
                        </div>

                        <div className="card-panel p-6 mt-6">
                            <label className="block text-sm text-slate-400 mb-2 font-bold">Archivist Notes</label>
                            <textarea className="input-base min-h-[100px] resize-y" placeholder="Where was this found? Who wields it?" value={currentWeapon.notes} onChange={(e) => setCurrentWeapon({...currentWeapon, notes: e.target.value})}></textarea>
                        </div>
                    </div>
                );
            };

            const renderAttachmentsList = () => {
                const filtered = attachmentFilter === 'all' ? attachments : attachments.filter(a => a.category === attachmentFilter);
                
                return (
                    <div className="animate-fade-in">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-4">
                            <div>
                                <h2 className="text-3xl font-black text-white tracking-wider flex items-center gap-3">
                                    <IconLibrary className="text-teal-500" size={32} />
                                    ATTACHMENT LIBRARY
                                </h2>
                                <p className="text-slate-400 mt-1 italic">Create & Store Modular Components</p>
                            </div>
                            <button onClick={startForgeAttachment} className="bg-teal-600 hover:bg-teal-500 text-white px-5 py-3 rounded-lg font-bold shadow-lg shadow-teal-900/30 transition flex items-center gap-2 shrink-0">
                                <IconWrench size={20} /> Forge Attachment
                            </button>
                        </div>

                        <div className="flex flex-wrap gap-2 mb-6">
                            {['all', 'form', 'grip', 'optic', 'mag', 'gem', 'godspark'].map(cat => (
                                <button key={cat} onClick={() => setAttachmentFilter(cat)} className={`px-4 py-1.5 rounded-full text-xs font-bold transition capitalize ${attachmentFilter === cat ? 'bg-teal-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 border border-slate-700'}`}>
                                    {cat === 'godspark' ? 'God-Sparks' : cat}
                                </button>
                            ))}
                        </div>

                        {filtered.length === 0 ? (
                            <div className="text-center py-20 card-panel border-dashed border-slate-600">
                                <IconWrench className="mx-auto text-slate-500 mb-4" size={48} />
                                <h3 className="text-xl text-slate-300 font-bold mb-2">No Attachments Found</h3>
                                <p className="text-slate-500 mb-6">Forge individual components here to equip them onto weapons later.</p>
                                <button onClick={startForgeAttachment} className="text-teal-400 hover:text-teal-300 font-bold underline">Forge Component</button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                {filtered.map(att => (
                                    <div key={att.id} className="card-panel card-hover p-4 border-l-4 border-l-teal-500 flex flex-col justify-between">
                                        <div>
                                            <div className="flex justify-between items-start mb-2">
                                                <span className="text-[10px] uppercase tracking-widest font-bold bg-slate-800 text-slate-400 px-2 py-0.5 rounded">{att.category}</span>
                                                {att.category === 'godspark' && <IconAlert size={14} className="text-red-500"/>}
                                            </div>
                                            <h4 className="font-bold text-white text-lg leading-tight mb-1">{att.name}</h4>
                                            <p className="text-xs text-slate-400 font-mono mb-2">{att.type}</p>
                                            {att.damage && <p className="text-xs text-red-400 font-mono bg-red-950/30 inline-block px-1 rounded mb-2">{att.damage}</p>}
                                            <p className="text-sm text-slate-300 line-clamp-3 mb-4">{att.description}</p>
                                        </div>
                                        <div className="flex justify-end gap-3 mt-2 border-t border-slate-700/50 pt-3">
                                            <button onClick={() => deleteAttachment(att.id)} className="text-slate-400 hover:text-red-500 transition-colors" title="Scrap"><IconTrash size={16} /></button>
                                            <button onClick={() => editAttachment(att)} className="text-teal-400 hover:text-teal-300 font-bold text-sm transition-colors">Edit</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            const renderAttachmentEditor = () => {
                if(!currentAttachment) return null;
                const cat = currentAttachment.category;

                return (
                    <div className="animate-fade-in max-w-3xl mx-auto pb-24">
                        <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                            <button onClick={() => setView('attachments')} className="text-slate-400 hover:text-white flex items-center gap-1 transition font-bold">
                                <IconChevronLeft size={20} /> Back to Library
                            </button>
                            <div className="flex gap-3">
                                <button onClick={() => { setAiTargetSlot('single_attachment'); setShowAiModal(true); }} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded font-bold shadow transition flex items-center gap-2 text-sm">
                                    <IconSparkles size={16} /> AI Forge
                                </button>
                                <button onClick={saveCurrentAttachment} className="bg-teal-600 hover:bg-teal-500 text-white px-6 py-2 rounded font-bold shadow-lg shadow-teal-900/30 transition flex items-center gap-2">
                                    <IconSave size={18} /> Save Component
                                </button>
                            </div>
                        </div>

                        <div className="card-panel p-6 border-t-4 border-t-teal-500">
                            <h2 className="text-2xl font-black text-white mb-6 uppercase tracking-wider flex items-center gap-2">
                                <IconWrench className="text-teal-500" />
                                Component Editor
                            </h2>

                            <div className="space-y-5">
                                <div>
                                    <label className="block text-sm text-slate-400 mb-1 font-bold">Attachment Category</label>
                                    <select className="input-base" value={currentAttachment.category} onChange={(e) => setCurrentAttachment({...currentAttachment, category: e.target.value})}>
                                        <option value="form">Form (Blade/Barrel)</option>
                                        <option value="grip">Grip (Handling/Stock)</option>
                                        <option value="optic">Optic (Sights)</option>
                                        <option value="mag">Mag (Ammunition/Core)</option>
                                        <option value="gem">Gemstone</option>
                                        <option value="godspark">God-Spark (Anomaly)</option>
                                    </select>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm text-slate-400 mb-1 font-bold">Name / Title</label>
                                        <input type="text" className="input-base font-bold text-white" placeholder="e.g. Weighted Brass Pommel" value={currentAttachment.name} onChange={(e) => setCurrentAttachment({...currentAttachment, name: e.target.value})} />
                                    </div>
                                    {cat !== 'godspark' && (
                                        <div>
                                            <label className="block text-sm text-slate-400 mb-1 font-bold">Tag / Type</label>
                                            <input type="text" className="input-base" placeholder="e.g. Melee Grip, Utility" value={currentAttachment.type} onChange={(e) => setCurrentAttachment({...currentAttachment, type: e.target.value})} />
                                        </div>
                                    )}
                                </div>

                                {cat === 'form' && (
                                    <div>
                                        <label className="block text-sm text-slate-400 mb-1 font-bold">Damage & Properties</label>
                                        <input type="text" className="input-base font-mono text-red-300" placeholder="e.g. 1d10 Piercing (Range 80/240)" value={currentAttachment.damage} onChange={(e) => setCurrentAttachment({...currentAttachment, damage: e.target.value})} />
                                    </div>
                                )}

                                {cat === 'gem' && (
                                    <div>
                                        <label className="block text-sm text-slate-400 mb-1 font-bold">Universal Mechanic / Rule</label>
                                        <textarea className="input-base h-20 resize-none" placeholder="Does this gem have a base rule before manufacturer integration?" value={currentAttachment.mechanic} onChange={(e) => setCurrentAttachment({...currentAttachment, mechanic: e.target.value})}></textarea>
                                    </div>
                                )}

                                <div>
                                    <label className="block text-sm text-slate-400 mb-1 font-bold">Combat Effect & Lore Description</label>
                                    <textarea className="input-base h-32 resize-none leading-relaxed" placeholder="Detailed description of what this component does..." value={currentAttachment.description} onChange={(e) => setCurrentAttachment({...currentAttachment, description: e.target.value})}></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
                    <TopNavigation />

                    {toast && (
                        <div className={`fixed bottom-6 right-6 z-50 px-6 py-3 rounded shadow-xl border font-bold flex items-center gap-2 toast-enter ${toast.type === 'error' ? 'bg-red-900/90 border-red-500 text-white' : 'bg-green-900/90 border-green-500 text-white'}`}>
                            {toast.message}
                        </div>
                    )}

                    <main>
                        {view === 'weapons' && renderWeaponsList()}
                        {view === 'weapon-editor' && renderWeaponEditor()}
                        {view === 'attachments' && renderAttachmentsList()}
                        {view === 'attachment-editor' && renderAttachmentEditor()}
                    </main>

                    {/* Outfit Basic Frame Modal */}
                    {showOutfitModal && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
                            <div className="bg-slate-900 border border-orange-500/50 rounded-xl max-w-4xl w-full p-6 my-8 shadow-[0_0_40px_rgba(249,115,22,0.15)] modal-enter">
                                <div className="text-center mb-6 border-b border-slate-800 pb-4">
                                    <h2 className="text-3xl font-black text-white uppercase tracking-wider mb-2">Outfit Basic Frame</h2>
                                    <p className="text-slate-400">A bare frame deals 1d6 Bludgeoning. Select a Manufacturer to begin building.</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto p-2">
                                    {MANUFACTURER_DATA.map(m => (
                                        <button key={m.id} onClick={() => confirmOutfitting(m.id)} className="text-left bg-slate-800 border border-slate-700 hover:border-orange-500 hover:bg-slate-800/80 p-4 rounded-lg transition-all group">
                                            <h3 className="text-lg font-bold text-white group-hover:text-orange-400">{m.name}</h3>
                                            <span className="inline-block px-2 py-0.5 rounded text-xs font-bold bg-slate-900 text-slate-300 border border-slate-600 mb-2 mt-1">{m.type}</span>
                                            <p className="text-xs text-emerald-400 mt-1"><strong>Trait:</strong> {m.trait}</p>
                                            <p className="text-xs text-slate-400 mt-1"><strong>Integration:</strong> {m.integration}</p>
                                        </button>
                                    ))}
                                </div>
                                <div className="mt-6 flex justify-end">
                                    <button onClick={() => { setShowOutfitModal(false); if(view !== 'weapon-editor') setView('weapons'); }} className="px-6 py-2 text-slate-400 hover:text-white font-medium bg-slate-800 rounded">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Attachment Selector Modal (Equip from Library) */}
                    {showSelectorModal.open && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 border border-teal-500/50 rounded-xl max-w-4xl w-full p-6 shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-4">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2 uppercase tracking-widest">
                                        <IconLibrary className="text-teal-400"/> Select <span className="text-teal-400">{showSelectorModal.slotKey}</span> Attachment
                                    </h3>
                                    <button onClick={() => setShowSelectorModal({open: false, slotKey: null})} className="text-slate-500 hover:text-white">✕</button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto pr-2">
                                    {attachments.filter(a => a.category === showSelectorModal.slotKey).length === 0 ? (
                                        <div className="text-center py-12">
                                            <p className="text-slate-500 mb-4">No {showSelectorModal.slotKey} attachments found in your Library.</p>
                                            <button onClick={() => { setShowSelectorModal({open: false, slotKey: null}); startForgeAttachment(); }} className="text-teal-400 underline font-bold">Go forge one first</button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {attachments.filter(a => a.category === showSelectorModal.slotKey).map(att => (
                                                <button key={att.id} onClick={() => equipToWeapon(att)} className="text-left p-4 bg-slate-800 border border-slate-700 hover:border-teal-400 hover:bg-slate-800/80 rounded-lg transition group">
                                                    <h4 className="font-bold text-white text-lg mb-1 group-hover:text-teal-400">{att.name}</h4>
                                                    <p className="text-xs text-slate-400 font-mono mb-2">{att.type}</p>
                                                    {att.damage && <p className="text-xs text-red-400 font-mono mb-2">{att.damage}</p>}
                                                    <p className="text-sm text-slate-300 line-clamp-2">{att.description}</p>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AI Generator Modal */}
                    {showAiModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 border border-indigo-500/50 rounded-xl max-w-2xl w-full p-6 shadow-[0_0_40px_rgba(99,102,241,0.2)]">
                                <div className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                        <IconSparkles className="text-indigo-400" /> The AI Smith
                                    </h3>
                                    <button onClick={() => setShowAiModal(false)} className="text-slate-500 hover:text-white">✕</button>
                                </div>
                                
                                {view === 'weapon-editor' && currentWeapon && (
                                    <div className="mb-4 bg-indigo-950/30 p-3 rounded border border-indigo-900/50">
                                        <p className="text-xs text-indigo-300 font-bold mb-1">Targeting Chassis:</p>
                                        <p className="text-sm text-slate-300">Manufacturer: <strong>{MANUFACTURER_DATA.find(m => m.id === currentWeapon.manufacturerId)?.name || "Custom"}</strong></p>
                                    </div>
                                )}

                                {view === 'attachment-editor' && currentAttachment && (
                                    <div className="mb-4 bg-indigo-950/30 p-3 rounded border border-indigo-900/50">
                                        <p className="text-xs text-indigo-300 font-bold mb-1">Targeting Component:</p>
                                        <p className="text-sm text-slate-300 uppercase font-bold">{currentAttachment.category}</p>
                                    </div>
                                )}

                                <div className="mb-4">
                                    {view === 'weapon-editor' && (
                                        <>
                                            <label className="block text-sm text-slate-400 mb-2 font-bold">Target Generation</label>
                                            <select className="input-base mb-4" value={aiTargetSlot} onChange={(e) => setAiTargetSlot(e.target.value)}>
                                                <option value="all">Entire Weapon (All Slots)</option>
                                            </select>
                                        </>
                                    )}
                                    <label className="block text-sm text-slate-400 mb-2 font-bold">Prompt / Instructions</label>
                                    <textarea className="input-base h-32 resize-none" placeholder="Describe what you want to forge..." value={aiPrompt} onChange={(e) => setAiPrompt(e.target.value)}></textarea>
                                </div>

                                <div className="flex justify-end gap-3 mt-6">
                                    <button onClick={() => setShowAiModal(false)} className="px-4 py-2 text-slate-400 hover:text-white font-medium">Cancel</button>
                                    <button onClick={generateWithAI} disabled={isGenerating || !aiPrompt.trim()} className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white px-6 py-2 rounded font-bold shadow-lg shadow-indigo-900/50 flex items-center gap-2">
                                        {isGenerating ? "Forging..." : "Commence Forging"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2"><IconSettings className="text-slate-400"/> System Settings</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-500 hover:text-white">✕</button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-white mb-2">Gemini API Key</label>
                                        <input type="password" placeholder="AI Studio Key" className="input-base font-mono" value={apiKey} onChange={(e) => {
                                            setApiKey(e.target.value);
                                            localStorage.setItem('akashic_gemini_key', e.target.value);
                                        }} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-white mb-2">AI Model String</label>
                                        <input type="text" className="input-base font-mono text-sm" value={aiModel} onChange={(e) => {
                                            setAiModel(e.target.value);
                                            localStorage.setItem('akashic_gemini_model', e.target.value);
                                        }} />
                                    </div>
                                </div>
                                <div className="mt-8 flex justify-end">
                                    <button onClick={() => setShowSettings(false)} className="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded font-bold">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
